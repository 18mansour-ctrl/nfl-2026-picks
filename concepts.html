<!doctype html><html><head><meta charset="utf-8"><title>Seeding concepts</title>
<style>
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Buch.woff2') format('woff2');font-weight:400}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Kraftig.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Halbfett.woff2') format('woff2');font-weight:600}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Dreiviertelfett.woff2') format('woff2');font-weight:700}
:root{--sans:'Sohne',system-ui,sans-serif;--paper:#FAFAF6;--card:#FFFDF7;--ink:#191917;
 --mut:#605F58;--fnt:#9C9B92;--hr:rgba(25,25,23,.09);--ln:rgba(25,25,23,.13);
 --cardsh:0 1px 1px rgba(25,25,23,.04),0 6px 16px -10px rgba(25,25,23,.3)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#D8D8D2;padding:14px;font-family:var(--sans);
 display:grid;grid-template-columns:1fr 1fr;gap:14px;zoom:.35}
.wrap{position:relative}
.tag{position:absolute;top:-34px;left:2px;font-size:30px;font-weight:700;color:#5C5B54}
.card{width:1080px;height:1350px;overflow:hidden;display:flex;flex-direction:column;
 background:var(--paper);color:var(--ink)}

.dh{background:var(--tc);color:var(--tf);height:212px;flex:none;padding:0 40px 30px;
 display:flex;align-items:flex-end;justify-content:space-between;gap:30px}
.dhr{font-size:54px;font-weight:700;line-height:1.02;letter-spacing:-.032em;color:#fff}
.dcw{text-align:right}
.dcl{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-bottom:4px;
 font-size:19px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.72}
.dcl svg{width:25px;height:37px;fill:currentColor;display:block;flex:none;margin-bottom:-3px}
.dch{display:flex;align-items:center;justify-content:flex-end;gap:20px}
.dlogo{width:82px;height:82px;flex:none;object-fit:contain;display:block}
.dch h1{font-size:68px;font-weight:700;line-height:1;letter-spacing:-.034em}
.dcs{margin-top:3px;font-size:19px;font-weight:500;letter-spacing:-.012em;opacity:.66}

.sec{flex:1;padding:30px 40px 0}
.h2{font-size:27px;font-weight:700;letter-spacing:-.028em;line-height:1.1;margin-bottom:20px}
.cfh{font-size:19px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
 padding-left:3px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;column-gap:30px}
.band{padding-left:3px;padding-bottom:7px;font-size:14px;font-weight:600;
 letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}

/* ---- A: the ladder — the higher the seed, the more of the card it holds --- */
.A .col{display:flex;flex-direction:column;gap:7px}
.A .r{display:flex;align-items:center;gap:14px;padding:0 18px;border-radius:10px;
 background:var(--card);box-shadow:var(--cardsh);min-width:0}
.A .r.f{background:var(--tc)}
.A .r.f .n{color:var(--tf);font-weight:700}
.A .r.f .s{background:var(--tf);color:var(--tc)}
.A .s{display:grid;place-items:center;border-radius:50%;flex:none;font-style:normal;
 font-weight:700;background:rgba(25,25,23,.07);color:var(--fnt)}
.A .n{font-weight:600;letter-spacing:-.026em;min-width:0;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.A .r1{height:124px}.A .r1 img{width:64px;height:64px}.A .r1 .n{font-size:38px}
.A .r1 .s{width:40px;height:40px;font-size:18px}
.A .r2{height:88px}.A .r2 img{width:48px;height:48px}.A .r2 .n{font-size:30px}
.A .r2 .s{width:34px;height:34px;font-size:16px}
.A .r3{height:64px}.A .r3 img{width:34px;height:34px}.A .r3 .n{font-size:23px}
.A .r3 .s{width:28px;height:28px;font-size:14px}
.A img{object-fit:contain;display:block;flex:none}
.A .bye{margin-left:auto;font-size:15px;font-weight:600;letter-spacing:.05em;
 text-transform:uppercase;opacity:.7}

/* ---- B: one strip a conference, seven marks across --------------------- */
.B .strip{display:grid;grid-template-columns:repeat(4,1fr) 20px repeat(3,1fr);gap:8px}
.B .t{border-radius:10px;background:var(--tc);color:var(--tf);height:150px;position:relative;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
 padding:10px 6px}
.B .t.o{background:var(--card);color:var(--mut);box-shadow:inset 0 0 0 1px var(--ln)}
.B .t i{position:absolute;top:8px;left:11px;font-style:normal;font-size:19px;font-weight:700;
 opacity:.6}
.B .t.o i{color:#C3C2B8;opacity:1}
.B .t img{width:52px;height:52px;object-fit:contain;display:block}
.B .t.o img{opacity:.5}
.B .t span{font-size:17px;font-weight:600;letter-spacing:-.018em;text-align:center;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.B .gap{grid-column:5}
.B .cfh{margin-top:26px}
.B .cfh:first-of-type{margin-top:0}

/* ---- C: editorial — the number is the graphic, colour is an edge -------- */
.C .col{display:flex;flex-direction:column}
.C .r{display:grid;grid-template-columns:74px 42px minmax(0,1fr) auto;align-items:center;
 gap:16px;height:82px;border-bottom:1px solid var(--hr);position:relative;padding-left:14px}
.C .r::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;
 border-radius:2px;background:var(--tc)}
.C .s{font-style:normal;font-size:50px;font-weight:700;letter-spacing:-.04em;
 color:#D2D1C7;line-height:1}
.C .r.f .s{color:var(--tc)}
.C img{width:42px;height:42px;object-fit:contain;display:block}
.C .n{font-size:30px;font-weight:600;letter-spacing:-.026em;min-width:0;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.C .w{font-size:14px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
 color:var(--fnt);white-space:nowrap}

/* ---- D: tiles, four across then three ---------------------------------- */
.D .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.D .t{border-radius:10px;background:var(--tc);color:var(--tf);height:132px;position:relative;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
 padding:10px 6px}
.D .t.o{background:var(--card);color:var(--mut);box-shadow:inset 0 0 0 1px var(--ln)}
.D .t i{position:absolute;top:8px;left:11px;font-style:normal;font-size:18px;font-weight:700;
 opacity:.6}
.D .t.o i{color:#C3C2B8;opacity:1}
.D .t img{width:46px;height:46px;object-fit:contain;display:block}
.D .t.o img{opacity:.5}
.D .t span{font-size:16px;font-weight:600;letter-spacing:-.018em;text-align:center;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.D .band{padding-top:16px}
.D .cfh{margin-top:26px}
.D .col>.cfh:first-child{margin-top:0}

/* ---- the awards row, shared ------------------------------------------- */
.daw{flex:none;height:214px;padding:26px 40px 0;display:flex;flex-direction:column;gap:34px}
.dawl{font-size:27px;font-weight:700;letter-spacing:-.028em;line-height:1.1}
.awrow{display:grid;grid-template-columns:repeat(3,1fr);column-gap:16px;align-items:center}
.aw{display:flex;align-items:center;gap:17px;min-width:0}
.dish{flex:none;width:108px;height:108px;border-radius:50%;overflow:hidden;position:relative;
 background:var(--c)}
.dish img{position:absolute;display:block;width:auto}
.awl{font-size:14.5px;font-weight:700;letter-spacing:.055em;text-transform:uppercase;
 color:var(--fnt)}
.awn{margin-top:5px;font-size:27px;font-weight:700;letter-spacing:-.032em;line-height:1.07}
.awm{margin-top:5px;font-size:15px;font-weight:500;color:var(--mut);letter-spacing:-.004em}
.awm i{font-style:normal;font-weight:400;color:var(--fnt);padding:0 7px}
</style></head><body id="b"></body><script>
const N={ARI:'Cardinals',ATL:'Falcons',BAL:'Ravens',BUF:'Bills',CAR:'Panthers',
 CHI:'Bears',CIN:'Bengals',CLE:'Browns',DAL:'Cowboys',DEN:'Broncos',DET:'Lions',
 GB:'Packers',HOU:'Texans',IND:'Colts',JAX:'Jaguars',KC:'Chiefs',LAC:'Chargers',
 LAR:'Rams',LV:'Raiders',MIA:'Dolphins',MIN:'Vikings',NE:'Patriots',NO:'Saints',
 NYG:'Giants',NYJ:'Jets',PHI:'Eagles',PIT:'Steelers',SEA:'Seahawks',SF:'49ers',
 TB:'Buccaneers',TEN:'Titans',WAS:'Commanders'};
const C={BUF:'#003087',MIA:'#008C95',PIT:'#FFB81C',CLE:'#311D00',HOU:'#E4002B',
 TEN:'#418FDE',LAC:'#0072CE',PHI:'#004851',DAL:'#0C2340',NYG:'#001E62',
 CHI:'#091F2C',GB:'#203731',ATL:'#A71930',LAR:'#003594',MIN:'#582C83'};
const FG=k=>['PIT'].includes(k)?'#fff'
 :(n=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};
   return .2126*f(n>>16&255)+.7152*f(n>>8&255)+.0722*f(n&255)>.42?'#191917':'#fff'})
   (parseInt(C[k].slice(1),16));
const EXT={nyj:'png'};
const img=k=>{const l=k.toLowerCase();return `<img src="logos/${l}.${EXT[l]||'webp'}" alt="">`};
const DIVOF={LAC:'West',PIT:'North',HOU:'South',MIA:'East',
             LAR:'West',CHI:'North',ATL:'South',PHI:'East'};
const ORDER={AFC:['LAC','PIT','HOU','MIA','TEN','CLE','BUF'],
             NFC:['LAR','CHI','ATL','PHI','DAL','GB','NYG']};

const HEAD=`<header class="dh">
 <p class="dhr">My 2026<br>NFL predictions</p>
 <div class="dcw"><p class="dcl"><svg viewBox="0 0 16 24"><ellipse cx="8" cy="4.7" rx="6.1" ry="3.4" transform="rotate(-22 8 4.7)"/><path d="M6.4 8.1c-.4 4.3-1.8 8.2-3.9 11h11c-2.1-2.8-3.5-6.7-3.9-11a4.7 4.7 0 0 1-3.2 0Z"/><rect x="1.1" y="19.5" width="13.8" height="3.4" rx=".7"/></svg>My Super Bowl champion</p>
  <div class="dch"><img class="dlogo" src="logos/buf.webp" alt=""><h1>Buffalo Bills</h1></div>
  <p class="dcs">over the New York Giants</p></div></header>`;
const AW=[['MVP','Josh Allen','joshallen','QB','Bills','#003087'],
 ['OPOY','Justin Jefferson','justinjefferson','WR','Vikings','#582C83'],
 ['DPOY','Myles Garrett','mylesgarrett','EDGE','Rams','#003594']];
const AWARDS=`<div class="daw"><p class="dawl">Award predictions</p><div class="awrow">`
 +AW.map(([l,n,f,p,t,c])=>`<div class="aw" style="--c:${c}">`
  +`<span class="dish"><img src="headshots/${f}.webp" alt=""></span>`
  +`<span><p class="awl">${l}</p><p class="awn">${n}</p>`
  +`<p class="awm">${p}<i>|</i>${t}</p></span></div>`).join('')+`</div></div>`;

/* ---- A ---- */
const A=`<div class="sec A"><p class="h2">Conference seeding</p><div class="two">`
 +['AFC','NFC'].map(cf=>`<div><p class="cfh">${cf}</p><div class="col">`
   +ORDER[cf].map((k,i)=>{const cls=i===0?'r1':i<4?'r2':'r3';
     return `<div class="r ${cls}${i<4?' f':''}" style="--tc:${C[k]};--tf:${FG(k)}">`
      +`<i class="s">${i+1}</i>${img(k)}<span class="n">${N[k]}</span>`
      +(i===0?`<span class="bye">Bye</span>`:'')+`</div>`}).join('')
   +`</div></div>`).join('')+`</div></div>`;

/* ---- B ---- */
const B=`<div class="sec B"><p class="h2">Conference seeding</p>`
 +['AFC','NFC'].map(cf=>`<p class="cfh">${cf}</p><div class="strip">`
   +ORDER[cf].map((k,i)=>(i===4?'<span class="gap"></span>':'')
     +`<div class="t${i<4?'':' o'}" style="--tc:${C[k]};--tf:${FG(k)}"><i>${i+1}</i>`
     +`${img(k)}<span>${N[k]}</span></div>`).join('')+`</div>`).join('')+`</div>`;

/* ---- C ---- */
const C2=`<div class="sec C"><p class="h2">Conference seeding</p><div class="two">`
 +['AFC','NFC'].map(cf=>`<div><p class="cfh">${cf}</p><div class="col">`
   +ORDER[cf].map((k,i)=>`<div class="r${i<4?' f':''}" style="--tc:${C[k]}">`
     +`<i class="s">${i+1}</i>${img(k)}<span class="n">${N[k]}</span>`
     +`<span class="w">${i<4?cf+' '+DIVOF[k]:'Wild card'}</span></div>`).join('')
   +`</div></div>`).join('')+`</div></div>`;

/* ---- D ---- */
const D=`<div class="sec D"><p class="h2">Conference seeding</p>`
 +['AFC','NFC'].map(cf=>`<div class="col"><p class="cfh">${cf}</p>`
   +`<p class="band" style="padding-top:0">Division winners</p><div class="grid">`
   +ORDER[cf].slice(0,4).map((k,i)=>`<div class="t" style="--tc:${C[k]};--tf:${FG(k)}">`
     +`<i>${i+1}</i>${img(k)}<span>${N[k]}</span></div>`).join('')+`</div>`
   +`<p class="band">Wild cards</p><div class="grid">`
   +ORDER[cf].slice(4).map((k,i)=>`<div class="t o" style="--tc:${C[k]}">`
     +`<i>${i+5}</i>${img(k)}<span>${N[k]}</span></div>`).join('')+`</div></div>`).join('')
 +`</div>`;

const LABELS=['A · the ladder','B · one strip a conference','C · editorial',
              'D · tiles, four then three'];
document.getElementById('b').innerHTML=[A,B,C2,D].map((sec,i)=>
 `<div class="wrap"><p class="tag">${LABELS[i]}</p>`
 +`<div class="card" style="--tc:#003087;--tf:#fff">${HEAD}${sec}${AWARDS}</div></div>`).join('');

(async()=>{for(const dish of document.querySelectorAll('.dish')){
 const im=dish.querySelector('img');await im.decode();
 const w=im.naturalWidth,h=im.naturalHeight,c=document.createElement('canvas');
 c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(im,0,0);
 const px=g.getImageData(0,0,w,h).data;
 let x0=w,y0=h,x1=0,y1=0;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(px[(y*w+x)*4+3]>12){
  if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
 const bw=x1-x0+1,bh=y1-y0+1,D=dish.clientHeight,k=D*.86/bh;
 im.style.height=h*k+'px';im.style.left=D/2-(x0+bw/2)*k+'px';
 im.style.bottom=-((h-1-y1)*k)+'px';
}})();
</script></html>
