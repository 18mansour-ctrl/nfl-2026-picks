<!doctype html><html><head><meta charset="utf-8"><title>Export card</title>
<style>
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Buch.woff2') format('woff2');font-weight:400}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Kraftig.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Halbfett.woff2') format('woff2');font-weight:600}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Dreiviertelfett.woff2') format('woff2');font-weight:700}
@font-face{font-family:'Sohne Schmal';src:url('fonts/SohneSchmal-Dreiviertelfett.woff2') format('woff2');font-weight:700}
:root{--sans:'Sohne',system-ui,sans-serif;--cond:'Sohne Schmal','Sohne',sans-serif;
 --paper:#FAFAF6;--card:#FFFDF7;--ink:#191917;--mut:#605F58;--fnt:#9C9B92;
 --hr:rgba(25,25,23,.09);--ln:rgba(25,25,23,.13)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#D8D8D2;padding:16px;font-family:var(--sans)}
body{zoom:.5} /* review only — authored at 1080x1350 */
.card{width:1080px;height:1350px;overflow:hidden;display:flex;flex-direction:column;
 background:var(--paper);color:var(--ink)}

.dh{background:var(--tc);color:var(--tf);height:206px;flex:none;padding:30px 40px 0;
 display:flex;flex-direction:column;justify-content:space-between}
.dhr{font-family:var(--cond);font-size:22px;font-weight:700;letter-spacing:.16em;
 text-transform:uppercase;opacity:.6}
.dch{display:flex;align-items:center;gap:22px;padding-bottom:22px}
.dlogo{width:104px;height:104px;flex:none;object-fit:contain;display:block}
.dch h1{font-size:84px;font-weight:700;line-height:1;letter-spacing:-.034em}

/* A bracket is a landscape shape; this frame is portrait. So it runs downward
   instead — six wild card games across the full width, then four, then two,
   then the final. Every row fills the frame, and the round a team reached is
   the width of its card. AFC holds the left half throughout, NFC the right. */
.br{flex:1;position:relative;padding:20px 32px 24px;display:flex;flex-direction:column;
 justify-content:space-between}
.lines{position:absolute;inset:0;pointer-events:none;z-index:0}
.cfh{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:10px;margin-bottom:2px;
 border-bottom:1px solid var(--hr)}
.cfh p{font-family:var(--cond);font-size:24px;font-weight:700;letter-spacing:.14em;
 text-transform:uppercase}
.rw{display:grid;gap:10px;position:relative;z-index:1}
.gm{background:var(--card);border:1px solid var(--ln);border-radius:10px;overflow:hidden;
 display:flex;flex-direction:column}
.sl{flex:1;display:grid;align-items:center;padding:0 12px}
.sl+.sl{border-top:1px solid var(--ln)}
.sd{font-style:normal;font-weight:600;color:var(--fnt);text-align:center}
.mk{display:grid;place-items:center}
.mk img{object-fit:contain;display:block;width:100%;height:100%}
.nm{font-weight:600;letter-spacing:-.022em;white-space:nowrap;overflow:hidden;
 text-overflow:ellipsis}
.sl.w .nm{font-weight:700}
.sl.out .nm{color:var(--mut);font-weight:400}
.sl.out .mk img{opacity:.5}
.sl.out .sd{color:#B9B8AE}

.r0 .gm{height:98px}.r1 .gm{height:106px}.r2 .gm{height:114px}.r3 .gm{height:146px}
.r0 .sl{grid-template-columns:14px 24px minmax(0,1fr);gap:8px;padding:0 10px}
.r1 .sl{grid-template-columns:16px 30px minmax(0,1fr);gap:11px}
.r2 .sl{grid-template-columns:17px 34px minmax(0,1fr);gap:13px}
.r3 .sl{grid-template-columns:19px 44px minmax(0,1fr);gap:16px;padding:0 22px}
.r0 .mk,.r0 .mk img{height:24px}.r1 .mk,.r1 .mk img{height:30px}
.r2 .mk,.r2 .mk img{height:34px}.r3 .mk,.r3 .mk img{height:44px}
.r0 .sd{font-size:12px}.r1 .sd{font-size:13px}.r2 .sd{font-size:14px}.r3 .sd{font-size:15px}
.r0 .nm{font-size:18px}.r1 .nm{font-size:24px}.r2 .nm{font-size:28px}.r3 .nm{font-size:36px}

.daw{flex:none;height:344px;display:grid;grid-template-columns:repeat(3,1fr);
 padding:0 34px;border-top:1px solid var(--hr)}
.aw{position:relative;overflow:hidden;padding:24px 10px 0}
.awl{font-family:var(--cond);font-size:17px;font-weight:700;letter-spacing:.14em;
 text-transform:uppercase;color:var(--fnt);position:relative;z-index:2}
.awn{position:relative;z-index:2;margin-top:7px;font-size:36px;font-weight:700;
 letter-spacing:-.032em;line-height:1.06;max-width:184px}
.face{position:absolute;right:-16px;bottom:0;height:250px;width:auto;z-index:1}
</style></head><body>
<div class="card" style="--tc:#003087;--tf:#fff">
 <header class="dh">
  <p class="dhr">Nick&rsquo;s picks &middot; 2026 NFL playoffs</p>
  <div class="dch"><img class="dlogo" src="logos/buf.webp" alt="">
   <h1>Buffalo Bills</h1></div>
 </header>
 <div class="br" id="br"><svg class="lines" id="lines"></svg>
  <div class="cfh"><p>AFC</p><p>NFC</p></div>
 </div>
 <div class="daw">
  <div class="aw"><p class="awl">MVP</p><img class="face" src="headshots/joshallen.webp" alt=""><p class="awn">Josh Allen</p></div>
  <div class="aw"><p class="awl">Offensive POY</p><img class="face" src="headshots/justinjefferson.webp" alt=""><p class="awn">Justin Jefferson</p></div>
  <div class="aw"><p class="awl">Defensive POY</p><img class="face" src="headshots/mylesgarrett.webp" alt=""><p class="awn">Myles Garrett</p></div>
 </div>
</div><script>
const T={PIT:['Steelers','#FFB81C','#fff'],BUF:['Bills','#003087','#fff'],
 HOU:['Texans','#E4002B','#fff'],CLE:['Browns','#311D00','#fff'],
 MIA:['Dolphins','#008C95','#fff'],TEN:['Titans','#418FDE','#fff'],
 LAC:['Chargers','#0072CE','#fff'],NYG:['Giants','#001E62','#fff'],
 GB:['Packers','#203731','#fff'],LAR:['Rams','#003594','#fff'],
 DAL:['Cowboys','#0C2340','#fff'],CHI:['Bears','#091F2C','#fff'],
 ATL:['Falcons','#A71930','#fff'],PHI:['Eagles','#004851','#fff']};
/* each round left to right: the AFC games first, then the NFC games */
const RDS=[['Wild card',[
  [['PIT',2],['BUF',7],1],[['HOU',3],['CLE',6],0],[['MIA',4],['TEN',5],1],
  [['CHI',2],['NYG',7],1],[['ATL',3],['GB',6],1],[['PHI',4],['DAL',5],1]]],
 ['Divisional',[
  [['LAC',1],['BUF',7],1],[['HOU',3],['TEN',5],1],
  [['LAR',1],['NYG',7],1],[['DAL',5],['GB',6],1]]],
 ['Conference championship',[
  [['TEN',5],['BUF',7],1],[['GB',6],['NYG',7],1]]],
 ['Super Bowl',[[['BUF',''],['NYG',''],0]]]];
const slot=([k,s],win)=>{const t=T[k];
 return `<span class="sl ${win?'w':'out'}">`
  +`<i class="sd">${s}</i><span class="mk"><img src="logos/${k.toLowerCase()}.webp" alt=""></span>`
  +`<span class="nm">${t[0]}</span></span>`};
const br=document.getElementById('br');
br.insertAdjacentHTML('beforeend',RDS.map(([l,gs],r)=>
 `<div class="rw r${r}" style="grid-template-columns:repeat(${gs.length},1fr)">`
 +gs.map(([a,b,w],i)=>`<div class="gm" data-r="${r}" data-i="${i}">${slot(a,!w)}${slot(b,!!w)}</div>`).join('')
 +`</div>`).join(''));

/* Square joints, drawn downward. The wild card round shares one spine per
   conference because reseeding makes it a re-draw; everything after it pairs. */
const svg=document.getElementById('lines'),bx=br.getBoundingClientRect();
svg.setAttribute('viewBox',`0 0 ${bx.width} ${bx.height}`);
const g=(r,i)=>{const e=br.querySelector(`.gm[data-r="${r}"][data-i="${i}"]`).getBoundingClientRect();
 return{x:e.left-bx.left+e.width/2,t:e.top-bx.top,b:e.bottom-bx.top}};
const d=[],join=(A,B)=>{
 const y=(Math.max(...A.map(p=>p.b))+Math.min(...B.map(p=>p.t)))/2;
 const xs=[...A,...B].map(p=>p.x);
 if(Math.max(...xs)-Math.min(...xs)>1)d.push(`M${Math.min(...xs)} ${y}H${Math.max(...xs)}`);
 A.forEach(p=>d.push(`M${p.x} ${p.b}V${y}`));
 B.forEach(p=>d.push(`M${p.x} ${y}V${p.t}`))};
[0,3].forEach((o,c)=>{                    /* c=0 AFC on the left, c=1 NFC */
 join([g(0,o),g(0,o+1),g(0,o+2)],[g(1,c*2),g(1,c*2+1)]);
 join([g(1,c*2),g(1,c*2+1)],[g(2,c)])});
join([g(2,0),g(2,1)],[g(3,0)]);
svg.innerHTML=d.map(p=>`<path d="${p}" fill="none" stroke="rgba(25,25,23,.24)" stroke-width="1.5"/>`).join('');
</script></body></html>
