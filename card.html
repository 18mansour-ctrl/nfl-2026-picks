<!doctype html><html><head><meta charset="utf-8"><title>Export card</title>
<style>
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Buch.woff2') format('woff2');font-weight:400}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Kraftig.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Halbfett.woff2') format('woff2');font-weight:600}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Dreiviertelfett.woff2') format('woff2');font-weight:700}
@font-face{font-family:'Sohne Schmal';src:url('fonts/SohneSchmal-Dreiviertelfett.woff2') format('woff2');font-weight:700}
:root{--sans:'Sohne',system-ui,sans-serif;--cond:'Sohne Schmal','Sohne',sans-serif;
 --paper:#FAFAF6;--card:#FFFDF7;--ink:#191917;--mut:#605F58;--fnt:#9C9B92;
 --hr:rgba(25,25,23,.09);
 --cardsh:0 1px 1px rgba(25,25,23,.04),0 6px 16px -10px rgba(25,25,23,.3)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#D8D8D2;padding:16px;font-family:var(--sans)}
body{zoom:.5} /* review only — authored at 1080x1350 */
.card{width:1080px;height:1350px;overflow:hidden;display:flex;flex-direction:column;
 background:var(--paper);color:var(--ink)}

/* the only colour on the card */
.dh{background:var(--tc);color:#fff;padding:44px 50px 46px;flex:none}
.dhr{font-family:var(--cond);font-size:25px;font-weight:700;letter-spacing:.14em;
 text-transform:uppercase;opacity:.66}
.dch{display:flex;align-items:center;gap:36px;margin-top:36px}
.dlogo{width:172px;height:172px;flex:none;object-fit:contain;display:block}
.dch h1{font-family:var(--cond);font-size:124px;font-weight:700;line-height:.84;
 letter-spacing:.004em;text-transform:uppercase}

/* the app's bracket, mirrored about the Super Bowl */
.bkt{flex:1;position:relative;display:grid;
 grid-template-columns:repeat(3,1fr) 188px repeat(3,1fr);
 gap:0 12px;align-items:stretch;padding:30px 26px 26px}
.blines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.bcol{display:flex;flex-direction:column;min-width:0;position:relative;z-index:1}
.bch{font-family:var(--cond);font-size:17px;font-weight:700;letter-spacing:.09em;
 text-transform:uppercase;color:var(--fnt);text-align:center;margin-bottom:14px;
 white-space:nowrap}
.bgs{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:20px}
.bgm{display:grid;border-radius:11px;background:var(--card);overflow:hidden;
 box-shadow:var(--cardsh);min-width:0}
.bsl{display:grid;grid-template-columns:15px auto minmax(0,1fr);align-items:center;gap:6px;
 min-height:56px;padding:0 9px;min-width:0}
.bsl.r{grid-template-columns:minmax(0,1fr) auto 15px;text-align:right}
.bsl+.bsl{border-top:1px solid var(--hr)}
.bsd{font-style:normal;font-size:13px;font-weight:600;color:var(--fnt);text-align:center}
.mark{display:grid;place-items:center;width:25px;height:25px;flex:none}
.mark img{width:100%;height:100%;object-fit:contain;display:block;opacity:.85}
.bnm{font-family:var(--cond);font-size:24px;font-weight:700;letter-spacing:.03em;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bsl.lost{opacity:.44}
.bsl.w{background:var(--tc)}
.bsl.w .bnm{color:var(--tf)}
.bsl.w .bsd{color:var(--tf);opacity:.65}
.bsl.w .mark img{opacity:1}

/* the middle is the final, which is what the mirror is for */
.mid{position:relative;z-index:1;display:flex;flex-direction:column;align-items:stretch}
.mid .sbw{margin-top:0;display:flex;flex-direction:column;justify-content:center;flex:1}
.mid .bgm{border-radius:13px}
.mid .bsl{min-height:74px}
.mid .bnm{font-size:30px}

.daw{flex:none;height:286px;display:grid;grid-template-columns:1fr 1fr 1fr;
 padding:0 34px 0}
.awc{position:relative;overflow:hidden;padding:6px 10px 0}
.awl{font-family:var(--cond);font-size:20px;font-weight:700;letter-spacing:.13em;
 text-transform:uppercase;color:var(--fnt);position:relative;z-index:2}
.face{position:absolute;right:-30px;bottom:0;height:196px;width:auto;object-fit:contain;z-index:1}
.awn{position:relative;z-index:2;margin-top:8px;font-family:var(--cond);font-size:40px;
 font-weight:700;letter-spacing:.03em;text-transform:uppercase;line-height:.92;max-width:180px}
</style></head><body>
<div class="card" style="--tc:#003087">
 <header class="dh">
  <p class="dhr">Nick&rsquo;s picks</p>
  <div class="dch"><img class="dlogo" src="logos/buf.webp" alt="">
   <h1>Buffalo<br>Bills</h1></div>
 </header>
 <div class="bkt"><svg class="blines"></svg><div class="bcol" data-cf="AFC"><p class="bch">Wild Card</p><div class="bgs"><div class="bgm" data-g="AFC-wc0"><span class="bsl lost" style="--tc:#FFB81C;--tf:#FFFFFF"><i class="bsd">2</i><span class="mark"><img src="logos/pit.webp" alt=""></span><span class="bnm">PIT</span></span><span class="bsl w" style="--tc:#003087;--tf:#FFFFFF"><i class="bsd">7</i><span class="mark"><img src="logos/buf.webp" alt=""></span><span class="bnm">BUF</span></span></div><div class="bgm" data-g="AFC-wc1"><span class="bsl w" style="--tc:#E4002B;--tf:#FFFFFF"><i class="bsd">3</i><span class="mark"><img src="logos/hou.webp" alt=""></span><span class="bnm">HOU</span></span><span class="bsl lost" style="--tc:#311D00;--tf:#FFFFFF"><i class="bsd">6</i><span class="mark"><img src="logos/cle.webp" alt=""></span><span class="bnm">CLE</span></span></div><div class="bgm" data-g="AFC-wc2"><span class="bsl lost" style="--tc:#008C95;--tf:#FFFFFF"><i class="bsd">4</i><span class="mark"><img src="logos/mia.webp" alt=""></span><span class="bnm">MIA</span></span><span class="bsl w" style="--tc:#418FDE;--tf:#FFFFFF"><i class="bsd">5</i><span class="mark"><img src="logos/ten.webp" alt=""></span><span class="bnm">TEN</span></span></div></div></div><div class="bcol" data-cf="AFC"><p class="bch">Divisional</p><div class="bgs"><div class="bgm" data-g="AFC-dv0"><span class="bsl lost" style="--tc:#0072CE;--tf:#FFFFFF"><i class="bsd">1</i><span class="mark"><img src="logos/lac.webp" alt=""></span><span class="bnm">LAC</span></span><span class="bsl w" style="--tc:#003087;--tf:#FFFFFF"><i class="bsd">7</i><span class="mark"><img src="logos/buf.webp" alt=""></span><span class="bnm">BUF</span></span></div><div class="bgm" data-g="AFC-dv1"><span class="bsl lost" style="--tc:#E4002B;--tf:#FFFFFF"><i class="bsd">3</i><span class="mark"><img src="logos/hou.webp" alt=""></span><span class="bnm">HOU</span></span><span class="bsl w" style="--tc:#418FDE;--tf:#FFFFFF"><i class="bsd">5</i><span class="mark"><img src="logos/ten.webp" alt=""></span><span class="bnm">TEN</span></span></div></div></div><div class="bcol" data-cf="AFC"><p class="bch">Championship</p><div class="bgs"><div class="bgm" data-g="AFC-cc"><span class="bsl lost" style="--tc:#418FDE;--tf:#FFFFFF"><i class="bsd">5</i><span class="mark"><img src="logos/ten.webp" alt=""></span><span class="bnm">TEN</span></span><span class="bsl w" style="--tc:#003087;--tf:#FFFFFF"><i class="bsd">7</i><span class="mark"><img src="logos/buf.webp" alt=""></span><span class="bnm">BUF</span></span></div></div></div><div class="mid"><p class="bch mid-l">Super Bowl</p><div class="sbw"><div class="bgm" data-g="sb"><span class="bsl w" style="--tc:#003087;--tf:#FFFFFF"><i class="bsd"></i><span class="mark"><img src="logos/buf.webp" alt=""></span><span class="bnm">BUF</span></span><span class="bsl lost" style="--tc:#001E62;--tf:#FFFFFF"><i class="bsd"></i><span class="mark"><img src="logos/nyg.webp" alt=""></span><span class="bnm">NYG</span></span></div></div></div><div class="bcol" data-cf="NFC"><p class="bch">Championship</p><div class="bgs"><div class="bgm" data-g="NFC-cc"><span class="bsl lost r" style="--tc:#203731;--tf:#FFFFFF"><span class="bnm">GB</span><span class="mark"><img src="logos/gb.webp" alt=""></span><i class="bsd">6</i></span><span class="bsl w r" style="--tc:#001E62;--tf:#FFFFFF"><span class="bnm">NYG</span><span class="mark"><img src="logos/nyg.webp" alt=""></span><i class="bsd">7</i></span></div></div></div><div class="bcol" data-cf="NFC"><p class="bch">Divisional</p><div class="bgs"><div class="bgm" data-g="NFC-dv0"><span class="bsl lost r" style="--tc:#003594;--tf:#FFFFFF"><span class="bnm">LAR</span><span class="mark"><img src="logos/lar.webp" alt=""></span><i class="bsd">1</i></span><span class="bsl w r" style="--tc:#001E62;--tf:#FFFFFF"><span class="bnm">NYG</span><span class="mark"><img src="logos/nyg.webp" alt=""></span><i class="bsd">7</i></span></div><div class="bgm" data-g="NFC-dv1"><span class="bsl lost r" style="--tc:#0C2340;--tf:#FFFFFF"><span class="bnm">DAL</span><span class="mark"><img src="logos/dal.webp" alt=""></span><i class="bsd">5</i></span><span class="bsl w r" style="--tc:#203731;--tf:#FFFFFF"><span class="bnm">GB</span><span class="mark"><img src="logos/gb.webp" alt=""></span><i class="bsd">6</i></span></div></div></div><div class="bcol" data-cf="NFC"><p class="bch">Wild Card</p><div class="bgs"><div class="bgm" data-g="NFC-wc0"><span class="bsl lost r" style="--tc:#091F2C;--tf:#FFFFFF"><span class="bnm">CHI</span><span class="mark"><img src="logos/chi.webp" alt=""></span><i class="bsd">2</i></span><span class="bsl w r" style="--tc:#001E62;--tf:#FFFFFF"><span class="bnm">NYG</span><span class="mark"><img src="logos/nyg.webp" alt=""></span><i class="bsd">7</i></span></div><div class="bgm" data-g="NFC-wc1"><span class="bsl lost r" style="--tc:#A71930;--tf:#FFFFFF"><span class="bnm">ATL</span><span class="mark"><img src="logos/atl.webp" alt=""></span><i class="bsd">3</i></span><span class="bsl w r" style="--tc:#203731;--tf:#FFFFFF"><span class="bnm">GB</span><span class="mark"><img src="logos/gb.webp" alt=""></span><i class="bsd">6</i></span></div><div class="bgm" data-g="NFC-wc2"><span class="bsl lost r" style="--tc:#004851;--tf:#FFFFFF"><span class="bnm">PHI</span><span class="mark"><img src="logos/phi.webp" alt=""></span><i class="bsd">4</i></span><span class="bsl w r" style="--tc:#0C2340;--tf:#FFFFFF"><span class="bnm">DAL</span><span class="mark"><img src="logos/dal.webp" alt=""></span><i class="bsd">5</i></span></div></div></div></div>
 <div class="daw"><div class="awc"><p class="awl">MVP</p><img class="face" src="headshots/joshallen.webp" alt=""><p class="awn">Josh Allen</p></div><div class="awc"><p class="awl">OPOY</p><img class="face" src="headshots/justinjefferson.webp" alt=""><p class="awn">Justin Jefferson</p></div><div class="awc"><p class="awl">DPOY</p><img class="face" src="headshots/mylesgarrett.webp" alt=""><p class="awn">Myles Garrett</p></div></div>
</div><script>
/* AFC feeds rightward, NFC leftward, and both meet in the middle. Same hairline
   routing as the app: the wild card winners pool onto one spine because that
   round is a re-draw, every later round is a real tree. */
(function(){
 const bkt=document.querySelector('.bkt'), svg=bkt.querySelector('.blines');
 const box=bkt.getBoundingClientRect();
 svg.setAttribute('viewBox',`0 0 ${box.width} ${box.height}`);
 const R=el=>{const r=el.getBoundingClientRect();
  return {l:r.left-box.left,r:r.right-box.left,y:r.top-box.top+r.height/2}};
 const d=[];
 ['AFC','NFC'].forEach(cf=>{
  const cols=[...bkt.querySelectorAll(`.bcol[data-cf="${cf}"]`)];
  const order=cf==='AFC'?cols:cols.slice().reverse();   // wild card first either way
  for(let i=1;i<order.length;i++){
   const prev=[...order[i-1].querySelectorAll('.bsl.w')], legs=[];
   order[i].querySelectorAll('.bsl').forEach(row=>{
    const k=row.querySelector('.bnm').textContent;
    const src=prev.find(p=>p.querySelector('.bnm').textContent===k);
    if(src)legs.push({a:R(src),b:R(row)})});
   if(!legs.length)continue;
   const out=cf==='AFC';
   const from=l=>out?l.a.r:l.a.l, to=l=>out?l.b.l:l.b.r;
   const gapA=out?Math.max(...legs.map(from)):Math.min(...legs.map(from));
   const gapB=out?Math.min(...legs.map(to)):Math.max(...legs.map(to));
   const x=(gapA+gapB)/2;
   if(i===1&&legs.length>1){
    const ys=legs.flatMap(l=>[l.a.y,l.b.y]);
    d.push(`M${x} ${Math.min(...ys)}V${Math.max(...ys)}`);
    legs.forEach(l=>{d.push(`M${from(l)} ${l.a.y}H${x}`);d.push(`M${x} ${l.b.y}H${to(l)}`)});
   } else legs.forEach(l=>{
    if(Math.abs(l.b.y-l.a.y)<1){d.push(`M${from(l)} ${l.a.y}H${to(l)}`);return}
    const dir=l.b.y>l.a.y?1:-1, rr=Math.min(7,Math.abs(l.b.y-l.a.y)/2), sx=out?1:-1;
    d.push(`M${from(l)} ${l.a.y}H${x-rr*sx}Q${x} ${l.a.y} ${x} ${l.a.y+rr*dir}`
      +`V${l.b.y-rr*dir}Q${x} ${l.b.y} ${x+rr*sx} ${l.b.y}H${to(l)}`)});
  }
  /* conference champion into the final */
  const cc=bkt.querySelector(`.bcol[data-cf="${cf}"] .bsl.w`);
  const champCol=[...bkt.querySelectorAll(`.bcol[data-cf="${cf}"]`)].find(c=>
   c.querySelector('.bch').textContent==='Championship');
  const w=champCol&&champCol.querySelector('.bsl.w');
  const sb=bkt.querySelector('.mid .bgm');
  if(w&&sb){
   const k=w.querySelector('.bnm').textContent;
   const target=[...sb.querySelectorAll('.bsl')].find(s=>s.querySelector('.bnm').textContent===k);
   if(target){const a=R(w),b=R(target),out=cf==='AFC';
    const fx=out?a.r:a.l, tx=out?b.l:b.r, mx=(fx+tx)/2;
    if(Math.abs(b.y-a.y)<1)d.push(`M${fx} ${a.y}H${tx}`);
    else{const dir=b.y>a.y?1:-1, rr=Math.min(7,Math.abs(b.y-a.y)/2), sx=out?1:-1;
     d.push(`M${fx} ${a.y}H${mx-rr*sx}Q${mx} ${a.y} ${mx} ${a.y+rr*dir}`
       +`V${b.y-rr*dir}Q${mx} ${b.y} ${mx+rr*sx} ${b.y}H${tx}`)}}}
 });
 svg.innerHTML=d.map(p=>`<path d="${p}" fill="none" stroke="rgba(25,25,23,.26)" stroke-width="1.5" stroke-linejoin="round"/>`).join('');
})();
</script></body></html>
