<!doctype html><html><head><meta charset="utf-8"><title>Export card</title>
<style>
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Buch.woff2') format('woff2');font-weight:400}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Kraftig.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Halbfett.woff2') format('woff2');font-weight:600}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Dreiviertelfett.woff2') format('woff2');font-weight:700}
@font-face{font-family:'Sohne Schmal';src:url('fonts/SohneSchmal-Dreiviertelfett.woff2') format('woff2');font-weight:700}
:root{--sans:'Sohne',system-ui,sans-serif;--cond:'Sohne Schmal','Sohne',sans-serif;
 --paper:#FAFAF6;--card:#FFFDF7;--ink:#191917;--mut:#605F58;--fnt:#9C9B92;
 --hr:rgba(25,25,23,.09);
 --cardsh:0 1px 1px rgba(25,25,23,.04),0 6px 16px -10px rgba(25,25,23,.3)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#D8D8D2;padding:16px;font-family:var(--sans)}
body{zoom:.5} /* review only — authored at 1080x1350 */
.card{width:1080px;height:1350px;overflow:hidden;display:flex;flex-direction:column;
 background:var(--paper);color:var(--ink)}

/* the only colour on the card outside the bracket fills */
.dh{background:var(--tc);color:#fff;height:200px;flex:none;padding:36px 54px 0;
 display:flex;flex-direction:column;justify-content:space-between}
.dhr{font-family:var(--cond);font-size:24px;font-weight:700;letter-spacing:.15em;
 text-transform:uppercase;opacity:.62}
.dch{display:flex;align-items:center;gap:26px;padding-bottom:26px}
.dlogo{width:104px;height:104px;flex:none;object-fit:contain;display:block}
.dch h1{font-family:var(--cond);font-size:92px;font-weight:700;line-height:.86;
 letter-spacing:.005em;text-transform:uppercase}

/* the bracket: four labelled rounds, AFC left and NFC right, read top down */
.bkt{flex:1;padding:30px 46px 34px;display:flex;flex-direction:column;
 justify-content:space-between}
.cfh{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.cfh p{font-family:var(--cond);font-size:32px;font-weight:700;letter-spacing:.15em;
 text-transform:uppercase;color:var(--ink)}
.rd{display:flex;flex-direction:column;gap:12px}
.rdl{display:flex;align-items:center;gap:14px;font-family:var(--cond);font-size:19px;
 font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--fnt)}
.rdl::after{content:"";flex:1;height:1px;background:var(--hr)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:17px 30px}
.bgm{border-radius:11px;background:var(--card);overflow:hidden;box-shadow:var(--cardsh)}
.bsl{display:grid;grid-template-columns:19px 30px minmax(0,1fr);align-items:center;gap:13px;
 height:38px;padding:0 15px}
.bsl+.bsl{border-top:1px solid var(--hr)}
.bsd{font-style:normal;font-size:14px;font-weight:600;color:var(--fnt);text-align:center}
.mark{display:grid;place-items:center;height:30px}
.mark img{width:30px;height:30px;object-fit:contain;display:block;opacity:.9}
.bnm{font-family:var(--cond);font-size:27px;font-weight:700;letter-spacing:.02em;
 text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bsl.lost{opacity:.4}
.bsl.w{background:var(--tc)}
.bsl.w .bnm{color:var(--tf)}
.bsl.w .bsd{color:var(--tf);opacity:.7}
.bsl.w .mark img{opacity:1}
.sb .bsl{height:56px;grid-template-columns:19px 40px minmax(0,1fr)}
.sb .mark,.sb .mark img{height:40px}.sb .mark img{width:40px}
.sb .bnm{font-size:36px}
.sb .rdl{font-size:22px;color:var(--ink)}
.sb .rdl::after{background:var(--ink);opacity:.16}

.daw{flex:none;height:300px;display:grid;grid-template-columns:repeat(3,1fr);
 padding:0 40px;border-top:1px solid var(--hr)}
.awc{position:relative;overflow:hidden;padding:22px 12px 0}
.awl{font-family:var(--cond);font-size:19px;font-weight:700;letter-spacing:.14em;
 text-transform:uppercase;color:var(--fnt);position:relative;z-index:2}
.face{position:absolute;right:-14px;bottom:0;height:214px;width:auto;z-index:1}
.awn{position:relative;z-index:2;margin-top:9px;font-family:var(--cond);font-size:44px;
 font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:.9;max-width:170px}
</style></head><body>
<div class="card" id="card" style="--tc:#003087">
 <header class="dh">
  <p class="dhr">Nick&rsquo;s picks &middot; 2026 NFL playoffs</p>
  <div class="dch"><img class="dlogo" src="logos/buf.webp" alt="">
   <h1>Buffalo Bills</h1></div>
 </header>
 <div class="bkt" id="bkt"></div>
 <div class="daw">
  <div class="awc"><p class="awl">MVP</p><img class="face" src="headshots/joshallen.webp" alt=""><p class="awn">Josh Allen</p></div>
  <div class="awc"><p class="awl">Offensive POY</p><img class="face" src="headshots/justinjefferson.webp" alt=""><p class="awn">Justin Jefferson</p></div>
  <div class="awc"><p class="awl">Defensive POY</p><img class="face" src="headshots/mylesgarrett.webp" alt=""><p class="awn">Myles Garrett</p></div>
 </div>
</div><script>
const T={PIT:['Pittsburgh Steelers','#FFB81C','#191917'],BUF:['Buffalo Bills','#003087','#fff'],
 HOU:['Houston Texans','#E4002B','#fff'],CLE:['Cleveland Browns','#311D00','#fff'],
 MIA:['Miami Dolphins','#008C95','#fff'],TEN:['Tennessee Titans','#418FDE','#fff'],
 LAC:['LA Chargers','#0072CE','#fff'],NYG:['New York Giants','#001E62','#fff'],
 GB:['Green Bay Packers','#203731','#fff'],LAR:['LA Rams','#003594','#fff'],
 DAL:['Dallas Cowboys','#0C2340','#fff'],CHI:['Chicago Bears','#091F2C','#fff'],
 ATL:['Atlanta Falcons','#A71930','#fff'],PHI:['Philadelphia Eagles','#004851','#fff']};
/* [higher seed, lower seed, index of the winner] */
const RDS=[
 ['Wild Card',[[['PIT',2],['BUF',7],1],[['HOU',3],['CLE',6],0],[['MIA',4],['TEN',5],1]],
             [[['CHI',2],['NYG',7],1],[['ATL',3],['GB',6],1],[['PHI',4],['DAL',5],1]]],
 ['Divisional',[[['LAC',1],['BUF',7],1],[['HOU',3],['TEN',5],1]],
               [[['LAR',1],['NYG',7],1],[['DAL',5],['GB',6],1]]],
 ['Conference Championship',[[['TEN',5],['BUF',7],1]],[[['GB',6],['NYG',7],1]]]];
const SB=[['BUF',''],['NYG',''],0];
const slot=([k,s],win)=>{const t=T[k];
 return `<span class="bsl ${win?'w':'lost'}" style="--tc:${t[1]};--tf:${t[2]}">`
  +`<i class="bsd">${s}</i><span class="mark"><img src="logos/${k.toLowerCase()}.webp" alt=""></span>`
  +`<span class="bnm">${t[0]}</span></span>`};
const game=([a,b,w])=>`<div class="bgm">${slot(a,!w)}${slot(b,!!w)}</div>`;
document.getElementById('bkt').innerHTML=
 `<div class="cfh"><p>AFC</p><p>NFC</p></div>`
 +RDS.map(([l,afc,nfc])=>`<section class="rd"><p class="rdl">${l}</p><div class="two">`
   +`<div>${afc.map(game).join('')}</div><div>${nfc.map(game).join('')}</div>`
   +`</div></section>`).join('')
 +`<section class="rd sb"><p class="rdl">Super Bowl</p>${game(SB)}</section>`;
</script></body></html>
