<!doctype html><html><head><meta charset="utf-8"><title>Export card</title>
<style>
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Buch.woff2') format('woff2');font-weight:400}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Kraftig.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Halbfett.woff2') format('woff2');font-weight:600}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Dreiviertelfett.woff2') format('woff2');font-weight:700}
@font-face{font-family:'Sohne Schmal';src:url('fonts/SohneSchmal-Dreiviertelfett.woff2') format('woff2');font-weight:700}
:root{--sans:'Sohne',system-ui,sans-serif;--cond:'Sohne Schmal','Sohne',sans-serif;
 --paper:#FAFAF6;--card:#FFFDF7;--ink:#191917;--mut:#605F58;--fnt:#9C9B92;
 --hr:rgba(25,25,23,.09);--ln:rgba(25,25,23,.13)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#D8D8D2;padding:16px;font-family:var(--sans)}
body{zoom:.5} /* review only — authored at 1080x1350 */
.card{width:1080px;height:1350px;overflow:hidden;display:flex;flex-direction:column;
 background:var(--paper);color:var(--ink)}

.dh{background:var(--tc);color:var(--tf);height:164px;flex:none;padding:26px 36px 0;
 display:flex;flex-direction:column;justify-content:space-between}
.dhr{font-family:var(--cond);font-size:22px;font-weight:700;letter-spacing:.16em;
 text-transform:uppercase;opacity:.6}
.dch{display:flex;align-items:center;gap:20px;padding-bottom:22px}
.dlogo{width:82px;height:82px;flex:none;object-fit:contain;display:block}
.dch h1{font-size:68px;font-weight:700;line-height:1;letter-spacing:-.034em}

/* Three rounds across, one conference at a time, the final in the seam between
   them. Of the ways a fourteen team bracket can be drawn this is the only one
   whose natural shape is taller than it is wide, which is why the mirrored and
   left-to-right versions never sat in this frame. Three columns instead of
   seven also means a card is wide enough for a team's full name. */
.br{flex:1;position:relative;padding:16px 36px 12px;display:flex;flex-direction:column}
.lines{position:absolute;inset:0;pointer-events:none;z-index:0}
.hd{display:grid;grid-template-columns:repeat(3,1fr);column-gap:20px;padding-bottom:9px;
 border-bottom:1px solid var(--hr)}
.hd p,.cf{font-family:var(--cond);font-weight:700;text-transform:uppercase}
.hd p{font-size:16px;letter-spacing:.14em;color:var(--fnt)}
.cf{font-size:23px;letter-spacing:.13em;padding:12px 0 6px;position:relative;z-index:1}
.bn{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(6,1fr);
 column-gap:20px;position:relative;z-index:1}
.gm{align-self:center;background:var(--card);border:1px solid var(--ln);border-radius:10px;
 overflow:hidden}
.sl{display:grid;grid-template-columns:18px 30px minmax(0,1fr);align-items:center;gap:12px;
 height:42px;padding:0 13px}
.sl+.sl{border-top:1px solid var(--ln)}
.sd{font-style:normal;font-size:13px;font-weight:600;text-align:center;color:var(--fnt)}
.mk{display:grid;place-items:center;height:30px}
.mk img{width:30px;height:30px;object-fit:contain;display:block}
.nm{font-size:24px;font-weight:600;letter-spacing:-.024em;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl.w .nm{font-weight:700}
.sl.out .nm{color:var(--mut);font-weight:400}
.sl.out .mk img{opacity:.5}
.sl.out .sd{color:#BBBAB0}

/* the seam: both conference finals drop straight into it */
.sm{flex:none;height:118px;display:grid;grid-template-columns:1fr 2fr;column-gap:20px;
 align-items:center;position:relative;z-index:1}
.sml{font-family:var(--cond);font-size:23px;font-weight:700;letter-spacing:.13em;
 text-transform:uppercase}
.sm .gm{align-self:center}
.sm .sl{height:58px;grid-template-columns:18px 38px minmax(0,1fr);padding:0 20px}
.sm .mk,.sm .mk img{height:38px}.sm .mk img{width:38px}
.sm .nm{font-size:30px}

.daw{flex:none;height:210px;display:grid;grid-template-columns:repeat(3,1fr);
 column-gap:22px;align-items:center;padding:0 36px;border-top:1px solid var(--hr)}
/* The cutouts are framed differently from one another, so bleeding them off
   the card cut each player at a different point and put a head through every
   name. Each sits in its own dish instead, which normalises the framing. */
.aw{display:flex;align-items:center;gap:17px;min-width:0}
.dish{flex:none;width:116px;height:116px;border-radius:50%;overflow:hidden;position:relative;
 background:var(--c)}
.dish img{position:absolute;display:block;width:auto}
.awt{min-width:0}
.awl{font-family:var(--cond);font-size:16px;font-weight:700;letter-spacing:.14em;
 text-transform:uppercase;color:var(--fnt)}
.awn{margin-top:5px;font-size:28px;font-weight:700;letter-spacing:-.032em;line-height:1.07}
.awm{margin-top:5px;font-size:15px;font-weight:500;color:var(--mut);letter-spacing:-.004em}
</style></head><body>
<div class="card" style="--tc:#003087;--tf:#fff">
 <header class="dh">
  <p class="dhr">Nick&rsquo;s picks &middot; 2026 NFL playoffs</p>
  <div class="dch"><img class="dlogo" src="logos/buf.webp" alt="">
   <h1>Buffalo Bills</h1></div>
 </header>
 <div class="br" id="br"><svg class="lines" id="lines"></svg>
  <div class="hd"><p>Wild card</p><p>Divisional</p><p>Conference</p></div>
 </div>
 <div class="daw">
  <div class="aw" style="--c:#003087"><span class="dish"><img src="headshots/joshallen.webp" alt=""></span>
   <span class="awt"><p class="awl">MVP</p><p class="awn">Josh Allen</p>
    <p class="awm">QB &middot; Buffalo Bills</p></span></div>
  <div class="aw" style="--c:#582C83"><span class="dish"><img src="headshots/justinjefferson.webp" alt=""></span>
   <span class="awt"><p class="awl">Offensive POY</p><p class="awn">Justin Jefferson</p>
    <p class="awm">WR &middot; Minnesota Vikings</p></span></div>
  <div class="aw" style="--c:#003594"><span class="dish"><img src="headshots/mylesgarrett.webp" alt=""></span>
   <span class="awt"><p class="awl">Defensive POY</p><p class="awn">Myles Garrett</p>
    <p class="awm">EDGE &middot; LA Rams</p></span></div>
 </div>
</div><script>
const T={PIT:'Pittsburgh Steelers',BUF:'Buffalo Bills',HOU:'Houston Texans',
 CLE:'Cleveland Browns',MIA:'Miami Dolphins',TEN:'Tennessee Titans',
 LAC:'LA Chargers',NYG:'New York Giants',GB:'Green Bay Packers',
 LAR:'LA Rams',DAL:'Dallas Cowboys',CHI:'Chicago Bears',
 ATL:'Atlanta Falcons',PHI:'Philadelphia Eagles'};
/* [higher seed, lower seed, index of the winner] */
const B={AFC:[
  [[['PIT',2],['BUF',7],1],[['HOU',3],['CLE',6],0],[['MIA',4],['TEN',5],1]],
  [[['LAC',1],['BUF',7],1],[['HOU',3],['TEN',5],1]],
  [[['TEN',5],['BUF',7],1]]],
 NFC:[
  [[['CHI',2],['NYG',7],1],[['ATL',3],['GB',6],1],[['PHI',4],['DAL',5],1]],
  [[['LAR',1],['NYG',7],1],[['DAL',5],['GB',6],1]],
  [[['GB',6],['NYG',7],1]]]};
const SPAN=[2,3,6];                        /* rows a game holds, per round */
const slot=([k,s],win)=>`<span class="sl ${win?'w':'out'}">`
 +`<i class="sd">${s}</i><span class="mk"><img src="logos/${k.toLowerCase()}.webp" alt=""></span>`
 +`<span class="nm">${T[k]}</span></span>`;
const game=([a,b,w])=>slot(a,!w)+slot(b,!!w);
const band=cf=>`<p class="cf">${cf}</p><div class="bn" data-cf="${cf}">`
 +B[cf].map((rd,r)=>rd.map((g,i)=>
   `<div class="gm" data-g="${cf}${r}${i}" style="grid-column:${r+1};`
   +`grid-row:${i*SPAN[r]+1}/span ${SPAN[r]}">${game(g)}</div>`).join('')).join('')
 +`</div>`;
document.getElementById('br').insertAdjacentHTML('beforeend',
 band('AFC')
 +`<div class="sm"><p class="sml">Super Bowl</p><div class="gm" data-g="SB">`
 +slot([['BUF'],''][0],1).replace('undefined','')
 +`</div></div>`
 +band('NFC'));
/* the final, written out rather than squeezed through the band helper */
document.querySelector('.sm .gm').innerHTML=
 slot(['BUF',''],1)+slot(['NYG',''],0);

const br=document.getElementById('br'),svg=document.getElementById('lines');
const bx=br.getBoundingClientRect();
svg.setAttribute('viewBox',`0 0 ${bx.width} ${bx.height}`);
const R=el=>{const r=el.getBoundingClientRect();
 return{l:r.left-bx.left,r:r.right-bx.left,t:r.top-bx.top,b:r.bottom-bx.top,
  x:r.left-bx.left+r.width/2,y:r.top-bx.top+r.height/2}};
const d=[],join=(A,Bt)=>{
 const x=(Math.max(...A.map(p=>p.r))+Math.min(...Bt.map(p=>p.l)))/2;
 const ys=[...A,...Bt].map(p=>p.y);
 if(Math.max(...ys)-Math.min(...ys)>1)d.push(`M${x} ${Math.min(...ys)}V${Math.max(...ys)}`);
 A.forEach(p=>d.push(`M${p.r} ${p.y}H${x}`));
 Bt.forEach(p=>d.push(`M${x} ${p.y}H${p.l}`))};
const col=(cf,r)=>[...br.querySelectorAll(`.gm[data-g^="${cf}${r}"]`)].map(R);
['AFC','NFC'].forEach(cf=>{join(col(cf,0),col(cf,1));join(col(cf,1),col(cf,2))});
/* both conference finals drop straight down or up into the seam */
const sb=R(br.querySelector('.gm[data-g="SB"]'));
[['AFC',1],['NFC',-1]].forEach(([cf,dir])=>{const c=col(cf,2)[0];
 const y1=dir>0?c.b:c.t, y2=dir>0?sb.t:sb.b, m=(y1+y2)/2;
 d.push(`M${c.x} ${y1}V${m}H${sb.x}V${y2}`)});
svg.innerHTML=d.map(p=>`<path d="${p}" fill="none" stroke="rgba(25,25,23,.24)" stroke-width="1.5"/>`).join('');

/* One cutout is 176x128 and another 600x436, each with its own amount of empty
   margin, so any fixed crop lines up on none of them. Measure the opaque box
   in every headshot and fit that to the dish instead — the three busts then
   sit at one scale on one baseline. */
(async()=>{for(const dish of document.querySelectorAll('.dish')){
 const img=dish.querySelector('img');await img.decode();
 const w=img.naturalWidth,h=img.naturalHeight,c=document.createElement('canvas');
 c.width=w;c.height=h;const g2=c.getContext('2d');g2.drawImage(img,0,0);
 const px=g2.getImageData(0,0,w,h).data;
 let x0=w,y0=h,x1=0,y1=0;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(px[(y*w+x)*4+3]>12){
  if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
 const bw=x1-x0+1,bh=y1-y0+1,D=dish.clientHeight,k=D*.97/bh;
 img.style.height=h*k+'px';
 img.style.left=D/2-(x0+bw/2)*k+'px';
 img.style.bottom=-((h-1-y1)*k)+'px';
}})();
</script></body></html>
