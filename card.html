<!doctype html><html><head><meta charset="utf-8"><title>Export card</title>
<style>
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Buch.woff2') format('woff2');font-weight:400}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Kraftig.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Halbfett.woff2') format('woff2');font-weight:600}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Dreiviertelfett.woff2') format('woff2');font-weight:700}
@font-face{font-family:'Sohne Schmal';src:url('fonts/SohneSchmal-Dreiviertelfett.woff2') format('woff2');font-weight:700}
:root{--sans:'Sohne',system-ui,sans-serif;--cond:'Sohne Schmal','Sohne',sans-serif;
 --paper:#F4F4F0;--ink:#111110;--grey:#8E8E86}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#D8D8D2;padding:16px;font-family:var(--sans)}
body{zoom:.5} /* review only — authored at 1080x1350 */
.card{width:1080px;height:1350px;overflow:hidden;display:flex;flex-direction:column;
 background:var(--paper);color:var(--ink)}
.lg{object-fit:contain;display:block}

/* the only colour on the card */
.dh{background:var(--tc);color:#fff;padding:46px 52px 48px;flex:none}
.dhr{font-family:var(--cond);font-size:25px;font-weight:700;letter-spacing:.14em;
 text-transform:uppercase;opacity:.66}
.dch{display:flex;align-items:center;gap:38px;margin-top:40px}
.dlogo{width:184px;height:184px;flex:none}
.dch h1{font-family:var(--cond);font-size:130px;font-weight:700;line-height:.84;
 letter-spacing:.004em;text-transform:uppercase}

/* everything below is ink on paper: the winner is the dark one */
.dbk{flex:1;display:grid;grid-template-columns:1fr 1fr}
.cf{padding:30px 30px 26px;display:flex;flex-direction:column;min-width:0}
.cf+.cf{border-left:2px solid var(--ink)}
.cfl{font-family:var(--cond);font-size:25px;font-weight:700;letter-spacing:.14em;
 text-transform:uppercase;color:var(--grey);margin-bottom:20px}
.cg{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.cc{display:flex;flex-direction:column;justify-content:space-around;gap:9px}
.gm{display:grid;gap:2px}
.cl{display:grid;grid-template-columns:18px 26px 1fr;align-items:center;gap:9px;
 padding:10px 9px;border:2px solid var(--ink);min-width:0;background:#fff}
.cl i{font-style:normal;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;
 color:var(--grey);text-align:center}
.cl .lg{width:26px;height:26px}
.cl b{font-family:var(--cond);font-size:28px;font-weight:700;letter-spacing:.03em}
.cl.w{background:var(--ink);color:#fff}
.cl.w i{color:rgba(255,255,255,.55)}

.daw{flex:none;height:298px;display:grid;grid-template-columns:1fr 1fr 1fr;
 border-top:2px solid var(--ink)}
.awc{position:relative;overflow:hidden;padding:22px 24px}
.awc+.awc{border-left:2px solid var(--ink)}
.awl{font-family:var(--cond);font-size:24px;font-weight:700;letter-spacing:.14em;
 text-transform:uppercase;color:var(--grey);position:relative;z-index:2}
.face{position:absolute;right:-34px;bottom:0;height:188px;width:auto;object-fit:contain;z-index:1}
/* name under its label, face bleeding out of the bottom right — the two were
   sharing the same corner and neither could be read */
.awn{position:relative;z-index:2;margin-top:10px;font-family:var(--cond);
 font-size:42px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
 line-height:.92;max-width:190px}
</style></head><body>
<div class="card F" style="--tc:#003087">
 <header class="dh">
  <p class="dhr">Nick&rsquo;s picks</p>
  <div class="dch"><img class="lg dlogo" src="logos/buf.webp" alt=""><h1>Buffalo<br>Bills</h1></div>
 </header>
 <div class="dbk"><div class="cf"><p class="cfl">AFC</p><div class="cg"><div class="cc"><div class="gm"><div class="cl"><i>2</i><img class="lg " src="logos/pit.webp" alt=""><b>PIT</b></div><div class="cl w"><i>7</i><img class="lg " src="logos/buf.webp" alt=""><b>BUF</b></div></div><div class="gm"><div class="cl w"><i>3</i><img class="lg " src="logos/hou.webp" alt=""><b>HOU</b></div><div class="cl"><i>6</i><img class="lg " src="logos/cle.webp" alt=""><b>CLE</b></div></div><div class="gm"><div class="cl"><i>4</i><img class="lg " src="logos/mia.webp" alt=""><b>MIA</b></div><div class="cl w"><i>5</i><img class="lg " src="logos/ten.webp" alt=""><b>TEN</b></div></div></div><div class="cc"><div class="gm"><div class="cl"><i>1</i><img class="lg " src="logos/lac.webp" alt=""><b>LAC</b></div><div class="cl w"><i>7</i><img class="lg " src="logos/buf.webp" alt=""><b>BUF</b></div></div><div class="gm"><div class="cl"><i>3</i><img class="lg " src="logos/hou.webp" alt=""><b>HOU</b></div><div class="cl w"><i>5</i><img class="lg " src="logos/ten.webp" alt=""><b>TEN</b></div></div></div><div class="cc"><div class="gm"><div class="cl"><i>5</i><img class="lg " src="logos/ten.webp" alt=""><b>TEN</b></div><div class="cl w"><i>7</i><img class="lg " src="logos/buf.webp" alt=""><b>BUF</b></div></div></div></div></div><div class="cf"><p class="cfl">NFC</p><div class="cg"><div class="cc"><div class="gm"><div class="cl"><i>2</i><img class="lg " src="logos/chi.webp" alt=""><b>CHI</b></div><div class="cl w"><i>7</i><img class="lg " src="logos/nyg.webp" alt=""><b>NYG</b></div></div><div class="gm"><div class="cl"><i>3</i><img class="lg " src="logos/atl.webp" alt=""><b>ATL</b></div><div class="cl w"><i>6</i><img class="lg " src="logos/gb.webp" alt=""><b>GB</b></div></div><div class="gm"><div class="cl"><i>4</i><img class="lg " src="logos/phi.webp" alt=""><b>PHI</b></div><div class="cl w"><i>5</i><img class="lg " src="logos/dal.webp" alt=""><b>DAL</b></div></div></div><div class="cc"><div class="gm"><div class="cl"><i>1</i><img class="lg " src="logos/lar.webp" alt=""><b>LAR</b></div><div class="cl w"><i>7</i><img class="lg " src="logos/nyg.webp" alt=""><b>NYG</b></div></div><div class="gm"><div class="cl"><i>5</i><img class="lg " src="logos/dal.webp" alt=""><b>DAL</b></div><div class="cl w"><i>6</i><img class="lg " src="logos/gb.webp" alt=""><b>GB</b></div></div></div><div class="cc"><div class="gm"><div class="cl"><i>6</i><img class="lg " src="logos/gb.webp" alt=""><b>GB</b></div><div class="cl w"><i>7</i><img class="lg " src="logos/nyg.webp" alt=""><b>NYG</b></div></div></div></div></div></div>
 <div class="daw"><div class="awc"><p class="awl">MVP</p><img class="face" src="headshots/joshallen.webp" alt=""><p class="awn">Josh Allen</p></div><div class="awc"><p class="awl">OPOY</p><img class="face" src="headshots/justinjefferson.webp" alt=""><p class="awn">Justin Jefferson</p></div><div class="awc"><p class="awl">DPOY</p><img class="face" src="headshots/mylesgarrett.webp" alt=""><p class="awn">Myles Garrett</p></div></div>
</div></body></html>
