<!doctype html><html><head><meta charset="utf-8"><title>Export cards</title>
<style>
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Buch.woff2') format('woff2');font-weight:400}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Kraftig.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Halbfett.woff2') format('woff2');font-weight:600}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Dreiviertelfett.woff2') format('woff2');font-weight:700}
@font-face{font-family:'Sohne Schmal';src:url('fonts/SohneSchmal-Dreiviertelfett.woff2') format('woff2');font-weight:700}
:root{--sans:'Sohne',system-ui,sans-serif;--cond:'Sohne Schmal','Sohne',sans-serif;
 --paper:#FAFAF6;--card:#FFFDF7;--ink:#191917;--mut:#605F58;--fnt:#9C9B92;
 --hr:rgba(25,25,23,.09);--ln:rgba(25,25,23,.13)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#D8D8D2;padding:16px;font-family:var(--sans);display:flex;gap:16px}
body{zoom:.5} /* review only — each card is authored at 1080x1350 */
.card{width:1080px;height:1350px;overflow:hidden;display:flex;flex-direction:column;
 background:var(--paper);color:var(--ink);flex:none}

.dh{background:var(--tc);color:var(--tf);height:212px;flex:none;padding:0 40px 30px;
 display:flex;align-items:flex-end;justify-content:space-between;gap:30px}
.dhr{font-size:54px;font-weight:700;line-height:1.02;letter-spacing:-.032em;color:#fff}
.dch{display:flex;align-items:center;justify-content:flex-end;gap:20px}
.dlogo{width:82px;height:82px;flex:none;object-fit:contain;display:block}
.dcw{text-align:right}
.dcl{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-bottom:4px;
 font-size:19px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.72}
/* the Lombardi in silhouette: the ball tipped on its stand, the flared neck,
   the plinth */
.dcl svg{width:25px;height:37px;fill:currentColor;display:block;flex:none;
 margin-bottom:-3px}
.dch h1{font-size:68px;font-weight:700;line-height:1;letter-spacing:-.034em}
/* Card two's header carried the champion, which spoiled the bracket sitting
   directly under it. It takes the matchup instead — same lockup shape as card
   one, a label over a mark, but two clubs facing each other rather than the
   winner named twice. */
.dsb{display:flex;align-items:center;gap:20px}
.dsb img{width:66px;height:66px;object-fit:contain;display:block}
.dsb b{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1}
.dsbv{font-size:19px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
 opacity:.5;padding:0 2px}

.dcs{margin-top:3px;font-size:19px;font-weight:500;letter-spacing:-.012em;opacity:.66}

/* ---- card one: the seeds ------------------------------------------------ */
/* The ledger's restraint with the ladder's hierarchy: nothing is filled — the
   seed numeral carries the club's colour and a hairline carries the rhythm —
   but the row height steps down by seed, so a bye is worth more of the column
   than a wild card. The right-hand column says why a club is seeded where it
   is, and the wild cards keep full-strength type under their own band. */
.sds{flex:1;padding:32px 40px 0;display:grid;grid-template-columns:1fr 1fr;
 column-gap:34px;align-content:start;font-variant-numeric:tabular-nums}
.dawl{font-size:27px;font-weight:700;letter-spacing:-.028em;line-height:1.1}
.sds>.dawl{grid-column:1/-1;margin-bottom:22px}
.sdh{display:flex;align-items:baseline;justify-content:space-between;
 padding:0 2px 11px;border-bottom:2px solid var(--ink);margin-bottom:4px}
.sdh b{font-size:31px;font-weight:700;letter-spacing:.035em;text-transform:uppercase}
.sdh span{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
 color:var(--fnt)}
.bandl{display:flex;align-items:center;gap:13px;padding:20px 2px 8px;
 font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
 color:var(--mut)}
.bandl::after{content:"";flex:1;height:1px;background:var(--hr)}
.sr{display:grid;grid-template-columns:66px auto minmax(0,1fr) auto;align-items:center;
 gap:0 18px;border-bottom:1px solid var(--hr)}
.sr:last-child{border-bottom:0}
.sr.brk{border-bottom:0}
.srn{font-style:normal;font-weight:700;letter-spacing:-.045em;line-height:1;
 color:var(--tc);text-align:center}
.smk{display:grid;place-items:center;flex:none}
.smk img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.srt{font-weight:600;letter-spacing:-.028em;min-width:0;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.srw{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
 color:var(--fnt);white-space:nowrap;text-align:right}
/* the slot is the seed */
.sr.s1{height:132px}.sr.s1 .srn{font-size:64px}.sr.s1 .smk{width:62px;height:62px}
.sr.s1 .srt{font-size:38px}.sr.s1 .srw{color:var(--mut)}
.sr.s2{height:108px}.sr.s2 .srn{font-size:56px}.sr.s2 .smk{width:52px;height:52px}
.sr.s2 .srt{font-size:32px}
.sr.s3{height:90px}.sr.s3 .srn{font-size:46px}.sr.s3 .smk{width:44px;height:44px}
.sr.s3 .srt{font-size:27px}

/* ---- card two: the bracket ---------------------------------------------- */
.br{flex:1;position:relative;padding:18px 36px 16px;display:flex;flex-direction:column}
.lines{position:absolute;inset:0;pointer-events:none;z-index:0}
.hd{display:grid;grid-template-columns:repeat(3,292px);justify-content:space-between;
 padding-bottom:9px;border-bottom:1px solid var(--hr)}
.hd p{font-family:var(--cond);font-size:16px;font-weight:700;letter-spacing:.14em;
 text-transform:uppercase;color:var(--fnt)}
.cf{font-family:var(--cond);font-size:23px;font-weight:700;letter-spacing:.13em;
 text-transform:uppercase;padding:14px 0 8px;position:relative;z-index:1}
.bn{flex:1;display:grid;grid-template-columns:repeat(3,292px);justify-content:space-between;
 grid-template-rows:repeat(6,1fr);position:relative;z-index:1}
.gm{align-self:center;background:var(--card);border:1px solid var(--ln);border-radius:10px;
 overflow:hidden}
.sl{display:grid;grid-template-columns:18px 32px minmax(0,1fr);align-items:center;gap:13px;
 height:54px;padding:0 15px}
.sl+.sl{border-top:1px solid var(--ln)}
.sd{font-style:normal;font-size:14px;font-weight:600;text-align:center;color:var(--fnt)}
.mk{display:grid;place-items:center;height:32px}
.mk img{width:32px;height:32px;object-fit:contain;display:block}
.nm{font-size:29px;font-weight:600;letter-spacing:-.024em;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl.w .nm{font-weight:700}
.sl.out .nm{color:var(--mut);font-weight:400}
.sl.out .mk img{opacity:.5}
.sl.out .sd{color:#BBBAB0}
.sm{flex:none;height:158px;display:grid;grid-template-columns:1fr 650px;align-items:center;
 position:relative;z-index:1}
.sml{font-family:var(--cond);font-size:23px;font-weight:700;letter-spacing:.13em;
 text-transform:uppercase}
.sm .sl{height:70px;grid-template-columns:18px 42px minmax(0,1fr);padding:0 22px}
.sm .mk,.sm .mk img{height:42px}.sm .mk img{width:42px}
.sm .nm{font-size:36px}

/* ---- the awards row, on card one ---------------------------------------- */
.daw{flex:none;height:214px;padding:26px 40px 0;
 display:flex;flex-direction:column;gap:34px}
/* the app's section heading: sentence case, tight, no rule under it */
.dawl{font-size:27px;font-weight:700;letter-spacing:-.028em;line-height:1.1}
.awrow{display:grid;grid-template-columns:repeat(3,1fr);column-gap:16px;align-items:center}
.aw{display:flex;align-items:center;gap:17px;min-width:0}
.dish{flex:none;width:108px;height:108px;border-radius:50%;overflow:hidden;position:relative;
 background:var(--c)}
.dish img{position:absolute;display:block;width:auto}
.awt{min-width:0}
.awl{font-size:14.5px;font-weight:700;letter-spacing:.055em;text-transform:uppercase;
 color:var(--fnt)}
.awn{margin-top:6px;font-size:27px;font-weight:700;letter-spacing:-.032em;line-height:1.07}
.awm{margin-top:5px;font-size:15px;font-weight:500;color:var(--mut);letter-spacing:-.004em}
.awm i{font-style:normal;font-weight:400;color:var(--fnt);padding:0 7px}
</style></head><body>

<div class="card" style="--tc:#003087;--tf:#fff">
 <header class="dh">
  <p class="dhr">My 2026<br>NFL predictions</p>
  <div class="dcw"><p class="dcl"><svg viewBox="0 0 16 24" aria-hidden="true"><ellipse cx="8" cy="4.7" rx="6.1" ry="3.4" transform="rotate(-22 8 4.7)"/><path d="M6.4 8.1c-.4 4.3-1.8 8.2-3.9 11h11c-2.1-2.8-3.5-6.7-3.9-11a4.7 4.7 0 0 1-3.2 0Z"/><rect x="1.1" y="19.5" width="13.8" height="3.4" rx=".7"/></svg>My Super Bowl champion</p>
   <div class="dch"><img class="dlogo" src="logos/buf.webp" alt="">
    <h1>Buffalo Bills</h1></div>
   <p class="dcs">over the New York Giants</p></div>
 </header>
 <div class="sds" id="sds"></div>
 <div class="daw">
  <p class="dawl">Award predictions</p>
  <div class="awrow">
  <div class="aw" style="--c:#003087"><span class="dish"><img src="headshots/joshallen.webp" alt=""></span>
   <span class="awt"><p class="awl">MVP</p><p class="awn">Josh Allen</p>
    <p class="awm">QB<i>|</i>Bills</p></span></div>
  <div class="aw" style="--c:#582C83"><span class="dish"><img src="headshots/justinjefferson.webp" alt=""></span>
   <span class="awt"><p class="awl">OPOY</p><p class="awn">Justin Jefferson</p>
    <p class="awm">WR<i>|</i>Vikings</p></span></div>
  <div class="aw" style="--c:#003594"><span class="dish"><img src="headshots/mylesgarrett.webp" alt=""></span>
   <span class="awt"><p class="awl">DPOY</p><p class="awn">Myles Garrett</p>
    <p class="awm">EDGE<i>|</i>Rams</p></span></div>
  </div>
 </div>
</div>

<div class="card" style="--tc:#003087;--tf:#fff">
 <header class="dh">
  <p class="dhr">My 2026<br>NFL predictions</p>
  <div class="dcw"><p class="dcl"><svg viewBox="0 0 16 24" aria-hidden="true"><ellipse cx="8" cy="4.7" rx="6.1" ry="3.4" transform="rotate(-22 8 4.7)"/><path d="M6.4 8.1c-.4 4.3-1.8 8.2-3.9 11h11c-2.1-2.8-3.5-6.7-3.9-11a4.7 4.7 0 0 1-3.2 0Z"/><rect x="1.1" y="19.5" width="13.8" height="3.4" rx=".7"/></svg>My Super Bowl</p>
   <div class="dsb"><img src="logos/buf.webp" alt=""><b>Bills</b>
    <span class="dsbv">vs</span><b>Giants</b><img src="logos/nyg.webp" alt=""></div></div>
 </header>
 <div class="br" id="br"><svg class="lines" id="lines"></svg>
  <div class="hd"><p>Wild card</p><p>Divisional</p><p>Conference</p></div>
 </div>
</div>

<script>
const N={ARI:'Cardinals',ATL:'Falcons',BAL:'Ravens',BUF:'Bills',CAR:'Panthers',
 CHI:'Bears',CIN:'Bengals',CLE:'Browns',DAL:'Cowboys',DEN:'Broncos',DET:'Lions',
 GB:'Packers',HOU:'Texans',IND:'Colts',JAX:'Jaguars',KC:'Chiefs',LAC:'Chargers',
 LAR:'Rams',LV:'Raiders',MIA:'Dolphins',MIN:'Vikings',NE:'Patriots',NO:'Saints',
 NYG:'Giants',NYJ:'Jets',PHI:'Eagles',PIT:'Steelers',SEA:'Seahawks',SF:'49ers',
 TB:'Buccaneers',TEN:'Titans',WAS:'Commanders'};
const C={BUF:'#003087',MIA:'#008C95',NE:'#0C2340',NYJ:'#115740',PIT:'#FFB81C',
 CLE:'#311D00',BAL:'#24125F',CIN:'#FB4F14',HOU:'#E4002B',TEN:'#418FDE',
 IND:'#002C5F',JAX:'#006778',LAC:'#0072CE',DEN:'#FB4F14',KC:'#C8102E',LV:'#000000',
 PHI:'#004851',DAL:'#0C2340',NYG:'#001E62',WAS:'#651C32',CHI:'#091F2C',
 GB:'#203731',DET:'#0069B1',MIN:'#582C83',ATL:'#A71930',TB:'#A6192E',
 CAR:'#0085CA',NO:'#D3BC8D',LAR:'#003594',SF:'#A6192E',SEA:'#0C2340',ARI:'#9B2743'};
const FG=k=>['PIT','NO','TEN','ARI'].includes(k)?'#fff'
 :(n=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};
   return .2126*f(n>>16&255)+.7152*f(n>>8&255)+.0722*f(n&255)>.42?'#191917':'#fff'})
   (parseInt(C[k].slice(1),16));
/* the block is the division winner, so it wears a crown rather than a 1 */
const CROWN='<svg class="crown" viewBox="0 0 24 20" aria-hidden="true">'
 +'<path d="M1.6 17.6V5.1l6.1 4.4L12 2.6l4.3 6.9 6.1-4.4v12.5z"/></svg>';
const CITY={ARI:'Arizona',ATL:'Atlanta',BAL:'Baltimore',BUF:'Buffalo',CAR:'Carolina',
 CHI:'Chicago',CIN:'Cincinnati',CLE:'Cleveland',DAL:'Dallas',DEN:'Denver',DET:'Detroit',
 GB:'Green Bay',HOU:'Houston',IND:'Indianapolis',JAX:'Jacksonville',KC:'Kansas City',
 LAC:'Los Angeles',LAR:'Los Angeles',LV:'Las Vegas',MIA:'Miami',MIN:'Minnesota',
 NE:'New England',NO:'New Orleans',NYG:'New York',NYJ:'New York',PHI:'Philadelphia',
 PIT:'Pittsburgh',SEA:'Seattle',SF:'San Francisco',TB:'Tampa Bay',TEN:'Tennessee',
 WAS:'Washington'};
const EXT={nyj:'png'};
const img=k=>{const l=k.toLowerCase();
 return `<img src="logos/${l}.${EXT[l]||'webp'}" alt="">`};

/* ---- card one ----------------------------------------------------------- */
/* seeds one to seven; the first four won a division, the last three did not */
const ORDER={AFC:['LAC','PIT','HOU','MIA','TEN','CLE','BUF'],
             NFC:['LAR','CHI','ATL','PHI','DAL','GB','NYG']};
const DIVOF={LAC:'West',PIT:'North',HOU:'South',MIA:'East',
             LAR:'West',CHI:'North',ATL:'South',PHI:'East'};
const smk=k=>{const l=k.toLowerCase();
 return `<span class="smk"><img src="logos/${l}.${EXT[l]||'webp'}" alt=""></span>`};
const seed=(cf,k,i)=>`<div class="sr s${i===0?1:i<4?2:3}${i===3?' brk':''}" `
 +`style="--tc:${C[k]}"><i class="srn">${i+1}</i>${smk(k)}`
 +`<span class="srt">${N[k]}</span>`
 +`<span class="srw">${i===0?'First-round bye':i<4?cf+' '+DIVOF[k]:''}</span></div>`;
document.getElementById('sds').innerHTML='<p class="dawl">Conference seeding</p>'
 +['AFC','NFC'].map(cf=>`<div><div class="sdh"><b>${cf}</b><span>Seeds 1&ndash;7</span></div>`
   +ORDER[cf].map((k,i)=>(i===4?'<p class="bandl">Wild cards</p>':'')+seed(cf,k,i)).join('')
   +`</div>`).join('');

/* ---- card two ----------------------------------------------------------- */
const B={AFC:[
  [[['PIT',2],['BUF',7],1],[['HOU',3],['CLE',6],0],[['MIA',4],['TEN',5],1]],
  [[['LAC',1],['BUF',7],1],[['HOU',3],['TEN',5],1]],
  [[['TEN',5],['BUF',7],1]]],
 NFC:[
  [[['CHI',2],['NYG',7],1],[['ATL',3],['GB',6],1],[['PHI',4],['DAL',5],1]],
  [[['LAR',1],['NYG',7],1],[['DAL',5],['GB',6],1]],
  [[['GB',6],['NYG',7],1]]]};
const SPAN=[2,3,6];
const slot=([k,s],win)=>`<span class="sl ${win?'w':'out'}">`
 +`<i class="sd">${s}</i><span class="mk">${img(k)}</span>`
 +`<span class="nm">${N[k]}</span></span>`;
const game=([a,b,w])=>slot(a,!w)+slot(b,!!w);
const band=cf=>`<p class="cf">${cf}</p><div class="bn" data-cf="${cf}">`
 +B[cf].map((rd,r)=>rd.map((g,i)=>
   `<div class="gm" data-g="${cf}${r}${i}" style="grid-column:${r+1};`
   +`grid-row:${i*SPAN[r]+1}/span ${SPAN[r]}">${game(g)}</div>`).join('')).join('')
 +`</div>`;
document.getElementById('br').insertAdjacentHTML('beforeend',
 band('AFC')
 +`<div class="sm"><p class="sml">Super Bowl</p><div class="gm" data-g="SB">`
 +slot(['BUF',''],1)+slot(['NYG',''],0)+`</div></div>`
 +band('NFC'));

const br=document.getElementById('br'),svg=document.getElementById('lines');
const bx=br.getBoundingClientRect();
svg.setAttribute('viewBox',`0 0 ${bx.width} ${bx.height}`);
const R=el=>{const r=el.getBoundingClientRect();
 return{l:r.left-bx.left,r:r.right-bx.left,t:r.top-bx.top,b:r.bottom-bx.top,
  x:r.left-bx.left+r.width/2,y:r.top-bx.top+r.height/2}};
const d=[],join=(A,Bt)=>{
 const x=(Math.max(...A.map(p=>p.r))+Math.min(...Bt.map(p=>p.l)))/2;
 const ys=[...A,...Bt].map(p=>p.y);
 if(Math.max(...ys)-Math.min(...ys)>1)d.push(`M${x} ${Math.min(...ys)}V${Math.max(...ys)}`);
 A.forEach(p=>d.push(`M${p.r} ${p.y}H${x}`));
 Bt.forEach(p=>d.push(`M${x} ${p.y}H${p.l}`))};
const col=(cf,r)=>[...br.querySelectorAll(`.gm[data-g^="${cf}${r}"]`)].map(R);
['AFC','NFC'].forEach(cf=>{join(col(cf,0),col(cf,1));join(col(cf,1),col(cf,2))});
const sb=R(br.querySelector('.gm[data-g="SB"]'));
[['AFC',1],['NFC',-1]].forEach(([cf,dir])=>{const c=col(cf,2)[0];
 const y1=dir>0?c.b:c.t, y2=dir>0?sb.t:sb.b, m=(y1+y2)/2;
 d.push(`M${c.x} ${y1}V${m}H${sb.x}V${y2}`)});
svg.innerHTML=d.map(p=>`<path d="${p}" fill="none" stroke="rgba(25,25,23,.24)" stroke-width="1.5"/>`).join('');

/* fit each headshot by its own opaque box, so differently framed cutouts
   still land at one scale on one baseline */
(async()=>{for(const dish of document.querySelectorAll('.dish')){
 const im=dish.querySelector('img');await im.decode();
 const w=im.naturalWidth,h=im.naturalHeight,c=document.createElement('canvas');
 c.width=w;c.height=h;const g2=c.getContext('2d');g2.drawImage(im,0,0);
 const px=g2.getImageData(0,0,w,h).data;
 let x0=w,y0=h,x1=0,y1=0;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(px[(y*w+x)*4+3]>12){
  if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
 const bw=x1-x0+1,bh=y1-y0+1,D=dish.clientHeight,k=D*.86/bh;
 im.style.height=h*k+'px';
 im.style.left=D/2-(x0+bw/2)*k+'px';
 im.style.bottom=-((h-1-y1)*k)+'px';
}})();
</script></body></html>
