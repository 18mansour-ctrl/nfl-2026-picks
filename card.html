<!doctype html><html><head><meta charset="utf-8"><title>Export card</title>
<style>
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Buch.woff2') format('woff2');font-weight:400}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Kraftig.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Halbfett.woff2') format('woff2');font-weight:600}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Dreiviertelfett.woff2') format('woff2');font-weight:700}
@font-face{font-family:'Sohne Schmal';src:url('fonts/SohneSchmal-Dreiviertelfett.woff2') format('woff2');font-weight:700}
:root{--sans:'Sohne',system-ui,sans-serif;--cond:'Sohne Schmal','Sohne',sans-serif;
 --paper:#FAFAF6;--ink:#191917;--mut:#605F58;--fnt:#9C9B92;--hr:rgba(25,25,23,.09)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#D8D8D2;padding:16px;font-family:var(--sans)}
body{zoom:.5} /* review only — authored at 1080x1350 */
.card{width:1080px;height:1350px;overflow:hidden;display:flex;flex-direction:column;
 background:var(--paper);color:var(--ink)}

/* the only colour on the card */
.dh{background:var(--tc);color:#fff;height:196px;flex:none;padding:36px 54px 0;
 display:flex;flex-direction:column;justify-content:space-between}
.dhr{font-family:var(--cond);font-size:24px;font-weight:700;letter-spacing:.15em;
 text-transform:uppercase;opacity:.62}
.dch{display:flex;align-items:center;gap:26px;padding-bottom:26px}
.dlogo{width:104px;height:104px;flex:none;object-fit:contain;display:block}
.dch h1{font-family:var(--cond);font-size:92px;font-weight:700;line-height:.86;
 letter-spacing:.005em;text-transform:uppercase}

/* the matchup, facing each other */
.sbm{flex:none;padding:44px 54px 50px;border-bottom:1px solid var(--hr)}
.lbl{font-family:var(--cond);font-size:20px;font-weight:700;letter-spacing:.16em;
 text-transform:uppercase;color:var(--fnt)}
.sbg{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;margin-top:26px}
.sbt{display:flex;align-items:center;gap:28px}
.sbt img{width:138px;height:138px;object-fit:contain;display:block;flex:none}
.sbt.a{justify-content:flex-end}
.sbt.b{flex-direction:row-reverse;text-align:right}
.sbc{font-size:21px;font-weight:600;color:var(--mut);letter-spacing:.03em}
.sbn{font-family:var(--cond);font-size:72px;font-weight:700;line-height:.9;
 letter-spacing:.01em;text-transform:uppercase;margin-top:3px}
.vs{font-family:var(--cond);font-size:26px;font-weight:700;color:var(--fnt);
 text-align:center;letter-spacing:.1em}

/* one row per playoff team, deepest run first — no team appears twice */
.ldr{flex:1;padding:42px 54px 0;display:grid;grid-template-columns:1fr 1fr;gap:0 44px;
 align-content:start}
.lch{font-family:var(--cond);font-size:30px;font-weight:700;letter-spacing:.15em;
 text-transform:uppercase;margin-bottom:14px}
.lr{display:grid;grid-template-columns:20px 34px minmax(0,1fr) auto;align-items:center;
 gap:0 16px;height:66px;padding:0 12px;border-radius:9px}
.lr+.lr{border-top:1px solid var(--hr)}
.lr img{width:34px;height:34px;object-fit:contain;display:block}
.ls{font-style:normal;font-size:14px;font-weight:600;color:var(--fnt);text-align:center}
.ln{font-family:var(--cond);font-size:29px;font-weight:700;letter-spacing:.02em;
 text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lx{font-family:var(--cond);font-size:16px;font-weight:700;letter-spacing:.11em;
 text-transform:uppercase;color:var(--fnt);white-space:nowrap}
.lr.out{opacity:.46}
.lr.chp{background:var(--tc);border-top-color:transparent}
.lr.chp+.lr{border-top-color:transparent}
.lr.chp .ln,.lr.chp .lx{color:var(--tf)}
.lr.chp .ls{color:var(--tf);opacity:.7}
.lr.chp .lx{opacity:.85}

.daw{flex:none;height:296px;display:grid;grid-template-columns:repeat(3,1fr);
 padding:0 44px;border-top:1px solid var(--hr)}
.awc{position:relative;overflow:hidden;padding:22px 12px 0}
.awl{font-family:var(--cond);font-size:19px;font-weight:700;letter-spacing:.14em;
 text-transform:uppercase;color:var(--fnt);position:relative;z-index:2}
.face{position:absolute;right:-14px;bottom:0;height:212px;width:auto;z-index:1}
.awn{position:relative;z-index:2;margin-top:9px;font-family:var(--cond);font-size:44px;
 font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:.9;max-width:170px}
</style></head><body>
<div class="card" style="--tc:#003087;--tf:#fff">
 <header class="dh">
  <p class="dhr">Nick&rsquo;s picks &middot; 2026 NFL playoffs</p>
  <div class="dch"><img class="dlogo" src="logos/buf.webp" alt="">
   <h1>Buffalo Bills</h1></div>
 </header>

 <section class="sbm">
  <p class="lbl">Super Bowl</p>
  <div class="sbg">
   <div class="sbt a"><img src="logos/buf.webp" alt="">
    <div><p class="sbc">Buffalo</p><p class="sbn">Bills</p></div></div>
   <p class="vs">vs</p>
   <div class="sbt b"><img src="logos/nyg.webp" alt="">
    <div><p class="sbc">New York</p><p class="sbn">Giants</p></div></div>
  </div>
 </section>

 <div class="ldr" id="ldr"></div>

 <div class="daw">
  <div class="awc"><p class="awl">MVP</p><img class="face" src="headshots/joshallen.webp" alt=""><p class="awn">Josh Allen</p></div>
  <div class="awc"><p class="awl">Offensive POY</p><img class="face" src="headshots/justinjefferson.webp" alt=""><p class="awn">Justin Jefferson</p></div>
  <div class="awc"><p class="awl">Defensive POY</p><img class="face" src="headshots/mylesgarrett.webp" alt=""><p class="awn">Myles Garrett</p></div>
 </div>
</div><script>
const NM={PIT:'Pittsburgh Steelers',BUF:'Buffalo Bills',HOU:'Houston Texans',
 CLE:'Cleveland Browns',MIA:'Miami Dolphins',TEN:'Tennessee Titans',LAC:'LA Chargers',
 NYG:'New York Giants',GB:'Green Bay Packers',LAR:'LA Rams',DAL:'Dallas Cowboys',
 CHI:'Chicago Bears',ATL:'Atlanta Falcons',PHI:'Philadelphia Eagles'};
/* [team, seed, how far it got] — ordered by finish, so the top row is the champion */
const RUN=[
 ['AFC',[['BUF',7,'Champion'],['TEN',5,'Conf final'],['LAC',1,'Divisional'],
         ['HOU',3,'Divisional'],['PIT',2,'Wild card'],['CLE',6,'Wild card'],
         ['MIA',4,'Wild card']]],
 ['NFC',[['NYG',7,'Super Bowl'],['GB',6,'Conf final'],['LAR',1,'Divisional'],
         ['DAL',5,'Divisional'],['CHI',2,'Wild card'],['ATL',3,'Wild card'],
         ['PHI',4,'Wild card']]]];
document.getElementById('ldr').innerHTML=RUN.map(([cf,ts])=>
 `<div><p class="lch">${cf}</p>`+ts.map(([k,s,x],i)=>
  `<div class="lr ${i===0&&x==='Champion'?'chp':i>3?'out':''}">`
  +`<i class="ls">${s}</i><img src="logos/${k.toLowerCase()}.webp" alt="">`
  +`<span class="ln">${NM[k]}</span><span class="lx">${x}</span></div>`).join('')
 +`</div>`).join('');
</script></body></html>
