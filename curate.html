<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Award boards — curate</title>
<style>
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Buch.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Kraftig.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Halbfett.woff2') format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Sohne';src:url('fonts/Sohne-Dreiviertelfett.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Sohne Schmal';src:url('fonts/SohneSchmal-Dreiviertelfett.woff2') format('woff2');font-weight:700;font-display:swap}
:root{
 --paper:#FAFAF6;--card:#FFFDF7;--ink:#191917;--body:#26251F;
 --mut:#605F58;--mut2:#4C4A43;--fnt:#9C9B92;
 --hr:rgba(25,25,23,.09);--hl:#FFE86B;--hls:#FFD84D;
 --sans:'Sohne',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
 --cond:'Sohne Schmal','Sohne',sans-serif;
 --cardsh:0 1px 1px rgba(25,25,23,.04),0 6px 16px -10px rgba(25,25,23,.3);
 --e-out:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
 font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:28px 20px 140px}

h1{font-size:29px;font-weight:700;letter-spacing:-.03em}
.sub{font-size:14px;color:var(--mut);margin-top:6px;max-width:60ch;line-height:1.5}

.tabs{display:flex;gap:6px;margin:26px 0 4px}
.tab{font-family:var(--cond);font-size:14px;font-weight:700;letter-spacing:.05em;
 text-transform:uppercase;color:var(--fnt);padding:8px 13px;border-radius:7px;
 transition:background .15s var(--e-out),color .15s var(--e-out)}
.tab:hover{color:var(--mut);background:rgba(25,25,23,.05)}
.tab.on{background:var(--ink);color:var(--paper)}
.tab b{font-weight:700;opacity:.55;margin-left:7px}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 12px}
.find{flex:1;min-width:190px;padding:9px 12px;border-radius:8px;background:var(--card);
 box-shadow:var(--cardsh);font-size:14px;outline:0;border:0}
.find::placeholder{color:var(--fnt)}
.btn{font-family:var(--cond);font-size:12.5px;font-weight:700;letter-spacing:.06em;
 text-transform:uppercase;color:var(--mut);padding:8px 11px;border-radius:7px;
 background:rgba(25,25,23,.055);white-space:nowrap;
 transition:background .15s var(--e-out),color .15s var(--e-out)}
.btn:hover{background:rgba(25,25,23,.11);color:var(--ink)}
.btn.go{background:var(--ink);color:var(--paper)}
.btn.go:hover{background:#000}
.count{font-size:12.5px;color:var(--fnt);margin-left:auto;white-space:nowrap}

.list{display:grid;gap:4px;margin-top:6px}
.row{display:grid;grid-template-columns:26px 30px 34px minmax(0,1fr) auto auto auto;
 align-items:center;gap:11px;padding:7px 10px 7px 6px;border-radius:8px;
 background:var(--card);box-shadow:var(--cardsh);will-change:transform}
.row.gone{display:none}
.row.lift{position:relative;z-index:5;box-shadow:0 12px 28px -12px rgba(25,25,23,.5)}
.row.slide{transition:transform 180ms var(--e-out)}
.grip{display:grid;grid-template-columns:repeat(2,3px);gap:3px;justify-content:center;
 padding:9px 6px;border-radius:6px;cursor:grab;touch-action:none}
.grip i{width:3px;height:3px;border-radius:50%;background:var(--fnt);display:block}
.grip:hover{background:rgba(25,25,23,.06)}
.n{font-family:var(--cond);font-size:13px;font-weight:700;color:var(--fnt);text-align:right}
.face{width:34px;height:34px;border-radius:7px;object-fit:cover;background:rgba(25,25,23,.06);
 display:block}
.face.none{display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--fnt);
 font-family:var(--cond);letter-spacing:.04em}
.who{min-width:0}
.nm{font-size:15px;font-weight:600;letter-spacing:-.015em;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11.5px;color:var(--mut);margin-top:1px;display:flex;align-items:center;
 gap:6px;flex-wrap:wrap;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--cond);font-size:11px;
 font-weight:700;letter-spacing:.05em;padding:2px 6px;border-radius:5px;
 background:var(--tc,rgba(25,25,23,.08));color:var(--tf,var(--mut))}
.tsel{-webkit-appearance:none;appearance:none;border:0;cursor:pointer;
 font-family:var(--cond);font-size:11px;font-weight:700;letter-spacing:.05em;
 padding:2px 6px;border-radius:5px;outline:0;text-align:center}
.psel{width:52px;border:0;outline:0;background:rgba(25,25,23,.05);border-radius:5px;
 padding:2px 5px;font-family:var(--cond);font-size:11px;font-weight:700;
 letter-spacing:.05em;color:var(--mut);text-transform:uppercase;text-align:center}
.psel:focus{background:rgba(25,25,23,.11);color:var(--ink)}
.warn{font-family:var(--cond);font-size:10.5px;font-weight:700;letter-spacing:.06em;
 color:#8A5A00;background:var(--hl);padding:2px 6px;border-radius:5px}
.odds{font-size:13px;font-weight:600;color:var(--mut2);font-variant-numeric:tabular-nums;
 white-space:nowrap}
.mv{display:flex;gap:2px}
.mv button{width:24px;height:24px;border-radius:6px;color:var(--fnt);font-size:12px;
 display:grid;place-items:center;transition:background .15s,color .15s}
.mv button:hover{background:rgba(25,25,23,.08);color:var(--ink)}
.del{width:26px;height:26px;border-radius:6px;color:var(--fnt);font-size:15px;
 display:grid;place-items:center;transition:background .15s,color .15s}
.del:hover{background:rgba(200,16,46,.12);color:#C8102E}

.dock{position:fixed;left:0;right:0;bottom:0;background:rgba(250,250,246,.94);
 backdrop-filter:blur(10px);border-top:1px solid var(--hr);padding:12px 20px;
 display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.dock .note{font-size:12.5px;color:var(--mut);margin-right:auto}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(8px);
 background:var(--ink);color:var(--paper);font-size:13px;padding:9px 14px;border-radius:8px;
 display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;
 transition:opacity .18s var(--e-out),transform .24s var(--e-out);z-index:20}
.toast.up{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{font-family:var(--cond);font-size:12px;font-weight:700;letter-spacing:.06em;
 text-transform:uppercase;color:var(--hls)}
.out{position:fixed;inset:0;background:rgba(25,25,23,.45);display:none;place-items:center;
 padding:24px;z-index:30}
.out.up{display:grid}
.sheet{background:var(--card);border-radius:12px;max-width:820px;width:100%;
 max-height:82vh;display:flex;flex-direction:column;overflow:hidden;
 box-shadow:0 24px 60px -20px rgba(25,25,23,.5)}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px 16px;
 border-bottom:1px solid var(--hr)}
.sheet h2{font-size:16px;font-weight:600;letter-spacing:-.02em;margin-right:auto}
.sheet textarea{flex:1;min-height:340px;border:0;outline:0;resize:none;padding:16px;
 font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.55;
 background:transparent;color:var(--body)}
.empty{padding:26px 10px;color:var(--fnt);font-size:14px}
/* narrow enough that the name and the price were colliding: drop the price and
   the controls onto their own line rather than letting the columns overlap */
@media(max-width:620px){
 .row{grid-template-columns:26px 26px 34px minmax(0,1fr) auto;row-gap:6px}
 .odds{grid-column:4;justify-self:start}
 .mv{grid-column:5;grid-row:1}
 .del{grid-column:5;grid-row:2;justify-self:end}
}
</style>
</head>
<body>
<div class="wrap">
 <h1>Award boards</h1>
 <p class="sub">Drag to reorder, or nudge a row with the arrows. Delete anyone who should
  not be on the board. Order and deletions are kept in this browser as you go — press
  <b>Export players.js</b> when you are done and paste the result into <code>src/players.js</code>.</p>

 <nav class="tabs" id="tabs"></nav>

 <div class="bar">
  <input class="find" id="find" type="search" placeholder="Filter this board" autocomplete="off" spellcheck="false">
  <button class="btn" id="byodds">Sort by odds</button>
  <button class="btn" id="onlyshots">Only with headshots</button>
  <button class="btn" id="restore">Restore deleted</button>
  <span class="count" id="count"></span>
 </div>

 <div class="list" id="list"></div>
 <p class="empty" id="empty" hidden>Nothing matches that filter.</p>
</div>

<div class="dock">
 <span class="note" id="note">Loading…</span>
 <span class="warn" id="gap" hidden></span>
 <button class="btn" id="resetall">Reset everything</button>
 <button class="btn" id="expcsv">Export CSV</button>
 <button class="btn go" id="expjs">Export players.js</button>
</div>

<div class="toast" id="toast"><span id="toastmsg"></span><button id="undo">Undo</button></div>

<div class="out" id="out">
 <div class="sheet">
  <header>
   <h2 id="outtitle">Export</h2>
   <button class="btn" id="copy">Copy</button>
   <button class="btn" id="save">Download</button>
   <button class="btn" id="close">Close</button>
  </header>
  <textarea id="outtext" spellcheck="false" readonly></textarea>
 </div>
</div>

<script>
const AWARDS=[['mvp','MVP'],['opoy','OPOY'],['dpoy','DPOY']];
const KEY='curate.boards.v1';
let TEAMS={}, DATA={mvp:[],opoy:[],dpoy:[]}, STATE=null, TAB='mvp';
let lastDeleted=null, toastTimer=null;

const $=s=>document.querySelector(s);
const slug=n=>n.toLowerCase().replace(/\s+(jr|sr|ii|iii|iv)\.?$/,'').replace(/[^a-z0-9]/g,'');
const lum=h=>{h=h.replace('#','');const v=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255)
 .map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4));return .2126*v[0]+.7152*v[1]+.0722*v[2]};

/* Team colours come straight out of the app's own source so this tool cannot
   drift from it — there is one definition of a team's colour in this repo. */
async function loadTeams(){
 const src=await (await fetch('src/core.js')).text();
 const re=/\{k:'(\w+)',city:'([^']*)',name:'([^']*)',conf:'(\w+)',div:'(\w+)',c:'(#\w+)',c2:'(#\w+)'\}/g;
 let m; while((m=re.exec(src))){
  TEAMS[m[1]]={k:m[1],city:m[2],name:m[3],c:m[6],c2:m[7],f:lum(m[6])>.42?'#191917':'#FFFFFF'}}
}

function parseCSV(text){
 const lines=text.trim().split(/\r?\n/), head=lines[0].split(',');
 return lines.slice(1).map(l=>{
  const cells=[]; let cur='', q=false;
  for(let i=0;i<l.length;i++){const ch=l[i];
   if(ch==='"'){q=!q;continue}
   if(ch===','&&!q){cells.push(cur);cur='';continue}
   cur+=ch}
  cells.push(cur);
  const o={}; head.forEach((h,i)=>o[h]=cells[i]||''); return o});
}

async function loadData(){
 const rows=parseCSV(await (await fetch('awards-odds-2026.csv')).text());
 rows.forEach(r=>{
  const a=r.award.toLowerCase(); if(!DATA[a])return;
  DATA[a].push({id:slug(r.player), name:r.player, team:r.team, pos:r.position,
   odds:r.odds, check:r.team_pos_confidence==='check',
   shot:r.have_headshot==='yes', file:r.headshot_file})});
}

/* State is only an order and a deleted set per board, so re-running the pull
   later brings in new names without discarding the curation. */
function blank(){const s={};AWARDS.forEach(([k])=>
 s[k]={order:DATA[k].map(r=>r.id),cut:[],edits:{}});return s}
function load(){
 try{const raw=localStorage.getItem(KEY); if(raw)STATE=JSON.parse(raw)}catch(e){}
 if(!STATE)STATE=blank();
 AWARDS.forEach(([k])=>{
  const s=STATE[k]||(STATE[k]={order:[],cut:[]});
  const known=new Set(DATA[k].map(r=>r.id));
  s.order=s.order.filter(id=>known.has(id));
  const seen=new Set(s.order);
  DATA[k].forEach(r=>{if(!seen.has(r.id))s.order.push(r.id)});
  s.cut=(s.cut||[]).filter(id=>known.has(id));
  s.edits=s.edits||{}});
}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(STATE))}catch(e){}};

/* Corrections live beside the order rather than in it, so re-pulling the odds
   keeps every team you have fixed by hand. */
const byId=k=>Object.fromEntries(DATA[k].map(r=>{
 const e=(STATE[k]&&STATE[k].edits||{})[r.id];
 return [r.id, e?{...r,...e,check:false}:r]}));
function live(k){const m=byId(k),cut=new Set(STATE[k].cut);
 return STATE[k].order.filter(id=>!cut.has(id)).map(id=>m[id])}

const TEAMKEYS=()=>Object.keys(TEAMS).sort();
const teamOpts=sel=>['<option value="">??</option>']
 .concat(TEAMKEYS().map(k=>`<option value="${k}"${k===sel?' selected':''}>${k}</option>`)).join('');

function rowHTML(r,i){
 const t=TEAMS[r.team];
 const style=t?`--tc:${t.c};--tf:${t.f}`:'';
 const face=r.shot?`<img class="face" src="headshots/${r.file}" alt="" loading="lazy">`
  :`<span class="face none">${r.name.split(' ').map(w=>w[0]).join('').slice(0,2)}</span>`;
 return `<div class="row" data-id="${r.id}">
 <span class="grip" data-grip title="Drag to reorder"><i></i><i></i><i></i><i></i><i></i><i></i></span>
 <span class="n">${i+1}</span>
 ${face}
 <span class="who"><span class="nm">${r.name}</span>
  <span class="meta">
   <select class="tsel chip" style="${style}" data-team>${teamOpts(r.team)}</select>
   <input class="psel" data-pos value="${r.pos||''}" placeholder="POS" size="4"
    autocomplete="off" spellcheck="false">
   ${r.check?'<span class="warn">check</span>':''}
   ${r.shot?'':'<span style="color:var(--fnt)">no headshot</span>'}</span></span>
 <span class="odds">${r.odds}</span>
 <span class="mv"><button data-up title="Move up">&#9650;</button>
  <button data-down title="Move down">&#9660;</button></span>
 <button class="del" data-del title="Remove from the board">&times;</button>
</div>`}

function render(){
 $('#tabs').innerHTML=AWARDS.map(([k,l])=>
  `<button class="tab${k===TAB?' on':''}" data-tab="${k}">${l}<b>${live(k).length}</b></button>`).join('');
 const rows=live(TAB);
 $('#list').innerHTML=rows.map(rowHTML).join('');
 $('#count').textContent=`${rows.length} on the board · ${STATE[TAB].cut.length} removed`;
 $('#note').textContent=AWARDS.map(([k,l])=>`${l} ${live(k).length}`).join('  ·  ');
 applyFilter(); gaps();
}

function applyFilter(){
 const q=$('#find').value.trim().toLowerCase();
 const only=$('#onlyshots').classList.contains('go');
 let shown=0;
 $('#list').querySelectorAll('.row').forEach(el=>{
  const r=byId(TAB)[el.dataset.id];
  const hit=(!q||r.name.toLowerCase().includes(q)||(r.team||'').toLowerCase().includes(q)
   ||(r.pos||'').toLowerCase().includes(q)) && (!only||r.shot);
  el.classList.toggle('gone',!hit); if(hit)shown++});
 $('#empty').hidden=shown>0;
}

function move(id,delta){
 const o=STATE[TAB].order, cut=new Set(STATE[TAB].cut);
 const vis=o.filter(x=>!cut.has(x));
 const at=vis.indexOf(id), to=at+delta;
 if(at<0||to<0||to>=vis.length)return;
 vis.splice(at,1); vis.splice(to,0,id);
 STATE[TAB].order=vis.concat(o.filter(x=>cut.has(x)));
 save(); flip(()=>render());
}

function cut(id){
 const r=byId(TAB)[id];
 STATE[TAB].cut.push(id); save();
 lastDeleted={award:TAB,id};
 toast(`Removed ${r.name}`);
 flip(()=>render());
}

function toast(msg){
 $('#toastmsg').textContent=msg; $('#toast').classList.add('up');
 clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('#toast').classList.remove('up'),5000);
}

/* Measure, mutate, then send every row back to where it was and let it go —
   so a delete or a nudge closes the gap instead of snapping shut. */
function flip(mutate){
 const before=new Map();
 $('#list').querySelectorAll('.row').forEach(el=>before.set(el.dataset.id,el.getBoundingClientRect().top));
 mutate();
 if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 $('#list').querySelectorAll('.row').forEach(el=>{
  const was=before.get(el.dataset.id); if(was==null)return;
  const dy=was-el.getBoundingClientRect().top; if(!dy)return;
  el.animate([{transform:`translateY(${dy}px)`},{transform:'none'}],
   {duration:280,easing:'cubic-bezier(.2,.7,.3,1)'})});
}

/* Pointer drag: the row under the finger follows it, the rest slide out of the
   way, and the DOM order is only rewritten on drop. */
function drag(e){
 if(e.button)return;
 const grip=e.target.closest('[data-grip]'); if(!grip)return;
 const row=grip.closest('.row'), list=$('#list');
 const items=[...list.querySelectorAll('.row:not(.gone)')];
 if(items.length<2)return;
 e.preventDefault(); grip.setPointerCapture(e.pointerId);
 const rects=items.map(r=>r.getBoundingClientRect());
 const h=rects[0].height+(rects[1]?rects[1].top-rects[0].bottom:0);
 let from=items.indexOf(row), to=from, edge=0, raf=0;
 const startY=e.clientY;
 row.classList.add('lift'); items.forEach(r=>{if(r!==row)r.classList.add('slide')});

 const place=dy=>{
  row.style.transform=`translateY(${dy}px)`;
  const next=Math.max(0,Math.min(items.length-1,from+Math.round(dy/h)));
  if(next===to)return; to=next;
  items.forEach((r,i)=>{if(r===row)return;
   let s=0;
   if(from<to&&i>from&&i<=to)s=-h; else if(from>to&&i>=to&&i<from)s=h;
   r.style.transform=s?`translateY(${s}px)`:''})};

 const move=ev=>{
  place(ev.clientY-startY+edge);
  const m=90, y=ev.clientY;
  const speed=y<m?-(m-y)/6:y>innerHeight-m?(y-(innerHeight-m))/6:0;
  if(speed&&!raf){const step=()=>{const b=scrollY;scrollBy(0,speed);edge+=scrollY-b;
    place(ev.clientY-startY+edge);raf=speed?requestAnimationFrame(step):0};
   raf=requestAnimationFrame(step)}
  else if(!speed&&raf){cancelAnimationFrame(raf);raf=0}};

 const up=()=>{
  if(raf){cancelAnimationFrame(raf);raf=0}
  grip.removeEventListener('pointermove',move);
  grip.removeEventListener('pointerup',up); grip.removeEventListener('pointercancel',up);
  items.forEach(r=>{r.style.transition='';r.style.transform='';r.classList.remove('lift','slide')});
  if(to!==from){
   const ids=items.map(r=>r.dataset.id);
   const [m]=ids.splice(from,1); ids.splice(to,0,m);
   const cutSet=new Set(STATE[TAB].cut);
   const hidden=STATE[TAB].order.filter(x=>!ids.includes(x));
   STATE[TAB].order=ids.concat(hidden.filter(x=>!cutSet.has(x)), STATE[TAB].cut);
   save()}
  render()};

 grip.addEventListener('pointermove',move);
 grip.addEventListener('pointerup',up);
 grip.addEventListener('pointercancel',up);
}

const oddsNum=o=>parseInt(String(o).replace('+',''),10)||1e9;

function exportJS(){
 const chunk=k=>live(k).map(r=>`['${r.name.replace(/'/g,"\\'")}','${r.team}','${r.pos}','${r.odds}']`);
 const wrap=a=>{const out=[];for(let i=0;i<a.length;i+=2)out.push(' '+a.slice(i,i+2).join(','));return out.join(',\n')};
 return `/* The three boards.\n   Curated with curate.html from awards-odds-2026.csv.\n`
  +`   MVP ${live('mvp').length} · OPOY ${live('opoy').length} · DPOY ${live('dpoy').length}. */\n`
  +`const BOARD={\n`
  +AWARDS.map(([k])=>`${k}:[\n${wrap(chunk(k))}\n]`).join(',\n')
  +`\n};\n`;
}
function exportCSV(){
 const rows=[['award','rank','player','team','position','odds','have_headshot','team_pos_confidence']];
 AWARDS.forEach(([k,l])=>live(k).forEach((r,i)=>
  rows.push([l,i+1,r.name,r.team,r.pos,r.odds,r.shot?'yes':'no',r.check?'check':'ok'])));
 return rows.map(r=>r.map(c=>/[",]/.test(String(c))?`"${c}"`:c).join(',')).join('\n');
}
/* Nothing should reach players.js without a team and a position — the app
   draws a logo and a fill from the first and prints the second. */
function gapRows(){const bad=[];
 AWARDS.forEach(([k,l])=>live(k).forEach(r=>{
  if(!r.team||!TEAMS[r.team]||!r.pos)bad.push(`${l}: ${r.name}`)}));
 return bad}
function gaps(){
 const bad=gapRows();
 $('#gap').textContent=bad.length?`${bad.length} row${bad.length>1?'s':''} still need a team or position`:'';
 $('#gap').hidden=!bad.length;
}
function show(title,text,file){
 $('#outtitle').textContent=title; $('#outtext').value=text;
 $('#out').classList.add('up'); $('#outtext').dataset.file=file;
 $('#outtext').select();
}

addEventListener('click',e=>{
 const t=e.target;
 const tab=t.closest('[data-tab]'); if(tab){TAB=tab.dataset.tab;render();return}
 const row=t.closest('.row');
 if(row){
  if(t.closest('[data-up]'))return move(row.dataset.id,-1);
  if(t.closest('[data-down]'))return move(row.dataset.id,1);
  if(t.closest('[data-del]'))return cut(row.dataset.id);
 }
 if(t.closest('#undo')&&lastDeleted){
  const {award,id}=lastDeleted; STATE[award].cut=STATE[award].cut.filter(x=>x!==id);
  lastDeleted=null; save(); $('#toast').classList.remove('up');
  if(award!==TAB)TAB=award;
  flip(()=>render()); return}
 if(t.closest('#byodds')){
  const m=byId(TAB);
  STATE[TAB].order=[...STATE[TAB].order].sort((a,b)=>oddsNum(m[a].odds)-oddsNum(m[b].odds));
  save(); flip(()=>render()); return}
 if(t.closest('#onlyshots')){t.closest('#onlyshots').classList.toggle('go');applyFilter();return}
 if(t.closest('#restore')){
  if(!STATE[TAB].cut.length)return toast('Nothing removed on this board');
  STATE[TAB].cut=[]; save(); flip(()=>render()); return}
 if(t.closest('#resetall')){
  if(!confirm('Throw away all reordering and deletions on all three boards?'))return;
  STATE=blank(); save(); render(); return}
 if(t.closest('#expjs')){
  const bad=gapRows();
  if(bad.length&&!confirm(`These still have no team or position and will break the app:\n\n`
   +bad.slice(0,12).join('\n')+(bad.length>12?`\n…and ${bad.length-12} more`:'')
   +`\n\nExport anyway?`))return;
  return show('src/players.js',exportJS(),'players.js')}
 if(t.closest('#expcsv'))return show('Curated CSV',exportCSV(),'awards-curated.csv');
 if(t.closest('#copy')){navigator.clipboard.writeText($('#outtext').value)
  .then(()=>toast('Copied'),()=>toast('Copy failed — select and copy by hand'));return}
 if(t.closest('#save')){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([$('#outtext').value],{type:'text/plain'}));
  a.download=$('#outtext').dataset.file; a.click(); URL.revokeObjectURL(a.href); return}
 if(t.closest('#close')||t===$('#out'))return $('#out').classList.remove('up');
});
function edit(id,field,value){
 const e=STATE[TAB].edits[id]||(STATE[TAB].edits[id]={});
 e[field]=value; save();
}
addEventListener('input',e=>{
 if(e.target.id==='find')return applyFilter();
 const row=e.target.closest('.row'); if(!row)return;
 if(e.target.matches('[data-pos]')){
  edit(row.dataset.id,'pos',e.target.value.trim().toUpperCase());
  row.querySelector('.warn')?.remove(); gaps()}});
addEventListener('change',e=>{
 const row=e.target.closest('.row'); if(!row)return;
 if(e.target.matches('[data-team]')){
  const k=e.target.value, t=TEAMS[k];
  edit(row.dataset.id,'team',k);
  e.target.style.cssText=t?`--tc:${t.c};--tf:${t.f}`:'';
  row.querySelector('.warn')?.remove(); gaps()}});
addEventListener('pointerdown',drag);
addEventListener('keydown',e=>{if(e.key==='Escape')$('#out').classList.remove('up')});

(async function boot(){
 try{
  await Promise.all([loadTeams(),loadData()]);
  load(); render();
 }catch(err){
  $('#note').textContent='Could not load — serve this over HTTP (./serve.sh 8145), not file://';
  console.error(err)}
})();
</script>
</body>
</html>
